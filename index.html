<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AI Camera - Mini MicroKit PT-L</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.0.1/paho-mqtt-min.js"></script>

<style>
/* =========================================================
   V6 - GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;
}

body {
    background: #f4f6f8;
    color: #202124;
    transition:
        background 0.25s ease,
        color 0.25s ease;
}

/* =========================================================
   APP
   ========================================================= */

.app {
    width: 100%;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;

    padding:
        12px
        14px
        8px;

    display: grid;

    grid-template-rows:
        auto
        minmax(120px, 0.72fr)
        minmax(0, 1.65fr)
        minmax(135px, 0.82fr)
        auto;

    gap: 8px;

    overflow: hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 48px;
}

.brand {
    min-width: 0;
}

.brand-title {
    margin: 0;

    font-size: clamp(20px, 5vw, 28px);
    font-weight: 800;
    letter-spacing: -0.5px;

    line-height: 1.05;
}

.brand-subtitle {
    margin-top: 3px;

    font-size: clamp(10px, 2.7vw, 13px);

    color: #7b8188;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 7px;

    flex-shrink: 0;
}

/* Top Test + Theme */

.top-action {
    width: 38px;
    height: 38px;

    border: none;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 17px;

    background: #ffffff;
    color: #30343a;

    box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.2s ease;
}

.top-action:active {
    transform: scale(0.94);
}

.top-action:hover {
    box-shadow:
        0 5px 16px rgba(0, 0, 0, 0.12);
}

.top-action.test {
    color: #315efb;
}

.top-action.theme {
    font-size: 18px;
}

/* =========================================================
   SUMMARY
   ========================================================= */

.summary {
    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 8px;
}

.card {
    background: #ffffff;

    border-radius: 16px;

    border: 1px solid rgba(0, 0, 0, 0.045);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.055);

    min-width: 0;
    min-height: 0;
}

.result-card {
    padding: 12px;

    display: flex;
    flex-direction: column;

    justify-content: center;
}

.card-label {
    font-size: 10px;
    font-weight: 700;

    color: #7d838b;

    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.result-value {
    margin-top: 5px;

    font-size: clamp(20px, 6vw, 32px);
    font-weight: 800;

    line-height: 1.1;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.result-sub {
    margin-top: 5px;

    font-size: 10px;

    color: #8b9198;
}

/* =========================================================
   CONFIDENCE CARD
   ========================================================= */

.confidence-card {
    position: relative;

    padding: 10px 11px 7px;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.confidence-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;

    gap: 5px;
}

.confidence-label {
    font-size: 10px;
    font-weight: 700;

    color: #7d838b;
}

.confidence-value {
    font-size: clamp(18px, 5vw, 27px);
    font-weight: 800;

    line-height: 1;
}

.chart-wrap {
    position: relative;

    flex: 1;

    min-height: 0;

    margin-top: 5px;
}

.chart {
    width: 100%;
    height: 100%;

    display: block;
}

.chart-grid {
    stroke: currentColor;
    opacity: 0.07;

    stroke-width: 1;
}

.chart-area {
    fill: currentColor;
    opacity: 0.07;
}

.chart-line {
    fill: none;

    stroke: currentColor;

    stroke-width: 2.2;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.chart-dot {
    fill: currentColor;
}

.chart-empty {
    stroke: currentColor;
    opacity: 0.12;

    stroke-width: 1;

    stroke-dasharray: 4 4;
}

/* =========================================================
   CAMERA CARD
   ========================================================= */

.camera-card {
    min-height: 0;

    padding: 10px;

    display: grid;

    grid-template-rows:
        auto
        minmax(0, 1fr)
        auto;

    gap: 8px;
}

.camera-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 26px;
}

.camera-title {
    font-size: 13px;
    font-weight: 800;
}

.topic {
    max-width: 48%;

    font-size: 9px;

    color: #858b92;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   CAMERA VIEW
   ========================================================= */

.camera-area {
    position: relative;

    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 14px;

    background: #101216;
}

#camera {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: #101216;
}

.camera-placeholder {
    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,0.72);

    pointer-events: none;
}

.camera-icon {
    font-size: 30px;

    margin-bottom: 6px;

    opacity: 0.75;
}

.camera-placeholder-text {
    font-size: 11px;

    text-align: center;
}

.live-badge {
    position: absolute;

    top: 8px;
    left: 8px;

    padding: 4px 7px;

    border-radius: 8px;

    font-size: 8px;
    font-weight: 800;

    letter-spacing: 0.5px;

    color: #ffffff;

    background: rgba(20, 24, 30, 0.72);

    backdrop-filter: blur(8px);
}

.live-dot {
    display: inline-block;

    width: 5px;
    height: 5px;

    margin-right: 4px;

    border-radius: 50%;

    background: #36d67a;

    box-shadow:
        0 0 7px rgba(54,214,122,0.9);
}

.camera-switch {
    position: absolute;

    right: 8px;
    top: 8px;

    width: 32px;
    height: 32px;

    border: none;
    border-radius: 9px;

    background: rgba(20,24,30,0.72);

    color: #ffffff;

    cursor: pointer;

    backdrop-filter: blur(8px);

    font-size: 15px;
}

.camera-switch:active {
    transform: scale(0.94);
}

/* =========================================================
   CAMERA CONTROLS
   ========================================================= */

.controls-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 7px;
}

.btn {
    min-width: 0;

    height: 36px;

    border: none;

    border-radius: 10px;

    font-size: 10px;
    font-weight: 750;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 5px;

    transition:
        transform 0.12s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
}

.btn:active {
    transform: scale(0.97);
}

.btn-running {
    background: #1f9d62;
    color: #ffffff;

    box-shadow:
        0 4px 12px rgba(31,157,98,0.2);
}

.btn-running.running {
    background: #168451;
}

.btn-stop {
    background: #ef4444;
    color: #ffffff;

    box-shadow:
        0 4px 12px rgba(239,68,68,0.18);
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-card {
    min-height: 0;

    padding: 11px;

    display: grid;

    grid-template-rows:
        auto
        auto
        auto
        auto;

    gap: 6px;
}

.settings-title {
    font-size: 12px;
    font-weight: 800;
}

.settings-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 6px;
}

.field {
    min-width: 0;

    position: relative;
}

.field.model {
    grid-column: 1 / -1;
}

.field-label {
    display: block;

    margin-bottom: 3px;

    font-size: 8px;
    font-weight: 700;

    color: #858b92;
}

.input-row {
    position: relative;
}

input {
    width: 100%;

    height: 31px;

    border: 1px solid #e0e4e8;

    border-radius: 8px;

    padding:
        0
        8px;

    outline: none;

    background: #f9fafb;

    color: #25282d;

    font-size: 10px;

    transition:
        border 0.2s ease,
        background 0.2s ease;
}

input:focus {
    border-color: #315efb;

    background: #ffffff;
}

.model input {
    padding-right: 38px;
}

.copy-btn {
    position: absolute;

    right: 3px;
    top: 3px;

    width: 25px;
    height: 25px;

    border: none;
    border-radius: 6px;

    background: #e9edf2;

    color: #555c64;

    cursor: pointer;

    font-size: 11px;
}

.save-row {
    display: flex;
    justify-content: center;
}

.save-btn {
    width: min(170px, 45%);

    height: 31px;

    border: none;
    border-radius: 8px;

    background: #315efb;
    color: #ffffff;

    font-size: 10px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(49,94,251,0.2);
}

.save-btn:active {
    transform: scale(0.98);
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer-caption {
    text-align: center;

    font-size: 8px;

    line-height: 12px;

    color: #969ba2;

    white-space: nowrap;
}

/* =========================================================
   DARK MODE
   ========================================================= */

body.dark {
    background: #111315;
    color: #f2f4f6;
}

body.dark .brand-subtitle,
body.dark .card-label,
body.dark .confidence-label,
body.dark .result-sub,
body.dark .field-label,
body.dark .topic,
body.dark .footer-caption {
    color: #858b94;
}

body.dark .card {
    background: #1a1d20;

    border-color: rgba(255,255,255,0.045);

    box-shadow:
        0 5px 18px rgba(0,0,0,0.25);
}

body.dark .top-action {
    background: #1c2024;
    color: #e7eaee;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.25);
}

body.dark .top-action.test {
    color: #7190ff;
}

body.dark input {
    background: #15181b;

    color: #f0f2f4;

    border-color: #30353a;
}

body.dark input:focus {
    background: #171a1d;

    border-color: #7190ff;
}

body.dark .copy-btn {
    background: #292e33;
    color: #d7dce2;
}

body.dark .camera-area,
body.dark #camera {
    background: #08090a;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

/* Small phone */

@media (max-height: 680px) {

    .app {
        padding:
            8px
            10px
            5px;

        gap: 5px;

        grid-template-rows:
            auto
            minmax(90px, 0.65fr)
            minmax(0, 1.55fr)
            minmax(112px, 0.78fr)
            auto;
    }

    .header {
        min-height: 40px;
    }

    .top-action {
        width: 34px;
        height: 34px;

        border-radius: 10px;
    }

    .camera-card {
        padding: 7px;

        gap: 6px;
    }

    .settings-card {
        padding: 8px;

        gap: 4px;
    }

    .btn {
        height: 32px;
    }

    input {
        height: 28px;
    }

    .copy-btn {
        height: 22px;
        width: 22px;
    }

    .save-btn {
        height: 28px;
    }
}

/* Very small height */

@media (max-height: 580px) {

    .app {
        padding:
            5px
            8px
            3px;

        gap: 4px;

        grid-template-rows:
            auto
            minmax(76px, 0.6fr)
            minmax(0, 1.7fr)
            minmax(95px, 0.72fr)
            auto;
    }

    .brand-title {
        font-size: 18px;
    }

    .brand-subtitle {
        font-size: 8px;
    }

    .top-action {
        width: 31px;
        height: 31px;

        font-size: 14px;
    }

    .camera-title {
        font-size: 11px;
    }

    .topic {
        font-size: 8px;
    }

    .btn {
        height: 29px;

        font-size: 9px;
    }

    .settings-title {
        font-size: 10px;
    }

    .field-label {
        font-size: 7px;
    }

    input {
        height: 25px;
    }

    .save-btn {
        height: 25px;
    }
}

/* Tablet / larger */

@media (min-width: 600px) {

    .app {
        padding:
            16px
            20px
            10px;

        gap: 10px;
    }

    .camera-card {
        padding: 12px;
    }

    .settings-card {
        padding: 13px;
    }

    .btn {
        height: 40px;
    }

    input {
        height: 34px;
    }

    .save-btn {
        height: 34px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="brand">

            <h1 class="brand-title">
                AI Camera
            </h1>

            <div class="brand-subtitle">
                AI Vision with Teachable Machine
            </div>

        </div>

        <!-- V6:
             TEST MOVED HERE
             THEME REMAINS HERE
        -->

        <div class="header-actions">

            <button
                class="top-action test"
                id="topTestBtn"
                title="Test Connection"
                aria-label="Test Connection"
            >
                🧪
            </button>

            <button
                class="top-action theme"
                id="themeBtn"
                title="Change Theme"
                aria-label="Change Theme"
            >
                🌙
            </button>

        </div>

    </header>


    <!-- =====================================================
         SUMMARY
         ===================================================== -->

    <section class="summary">

        <!-- Result -->

        <div class="card result-card">

            <div class="card-label">
                ผลการวิเคราะห์
            </div>

            <div
                class="result-value"
                id="resultText"
            >
                รอการตรวจจับ
            </div>

            <div
                class="result-sub"
                id="resultSub"
            >
                AI is waiting for camera
            </div>

        </div>


        <!-- Confidence -->

        <div class="card confidence-card">

            <div class="confidence-top">

                <div class="confidence-label">
                    ความแม่นยำ
                </div>

                <div
                    class="confidence-value"
                    id="confidenceValue"
                >
                    0.0%
                </div>

            </div>

            <div class="chart-wrap">

                <svg
                    id="confidenceChart"
                    class="chart"
                    viewBox="0 0 300 100"
                    preserveAspectRatio="none"
                >

                    <line
                        class="chart-grid"
                        x1="0"
                        y1="25"
                        x2="300"
                        y2="25"
                    />

                    <line
                        class="chart-grid"
                        x1="0"
                        y1="50"
                        x2="300"
                        y2="50"
                    />

                    <line
                        class="chart-grid"
                        x1="0"
                        y1="75"
                        x2="300"
                        y2="75"
                    />

                    <path
                        id="chartArea"
                        class="chart-area"
                    />

                    <path
                        id="chartLine"
                        class="chart-line"
                    />

                    <circle
                        id="chartDot"
                        class="chart-dot"
                        r="3"
                        cx="0"
                        cy="100"
                    />

                    <line
                        id="chartEmpty"
                        class="chart-empty"
                        x1="0"
                        y1="100"
                        x2="300"
                        y2="100"
                    />

                </svg>

            </div>

        </div>

    </section>


    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <section class="card camera-card">

        <div class="camera-header">

            <div class="camera-title">
                AI Camera
            </div>

            <div
                class="topic"
                id="topicText"
            >
                MQTT: not connected
            </div>

        </div>


        <div class="camera-area">

            <video
                id="camera"
                autoplay
                muted
                playsinline
            ></video>


            <div
                class="camera-placeholder"
                id="cameraPlaceholder"
            >

                <div class="camera-icon">
                    📷
                </div>

                <div class="camera-placeholder-text">
                    กด Running เพื่อเริ่มกล้อง
                </div>

            </div>


            <div
                class="live-badge"
                id="liveBadge"
                style="display:none;"
            >
                <span class="live-dot"></span>
                LIVE
            </div>


            <button
                class="camera-switch"
                id="switchCameraBtn"
                title="Switch Camera"
                aria-label="Switch Camera"
            >
                🔄
            </button>

        </div>


        <!-- V6:
             ONLY RUNNING + STOP
             TEST AND THEME HAVE BEEN REMOVED
        -->

        <div class="controls-grid">

            <button
                class="btn btn-running"
                id="runBtn"
            >
                ▶ Running
            </button>

            <button
                class="btn btn-stop"
                id="stopBtn"
            >
                ■ Stop
            </button>

        </div>

    </section>


    <!-- =====================================================
         SETTINGS
         ===================================================== -->

    <section class="card settings-card">

        <div class="settings-title">
            การตั้งค่าโมเดลและการเชื่อมต่อ
        </div>


        <div class="settings-grid">

            <!-- Model ID -->

            <div class="field model">

                <label class="field-label">
                    Model ID
                </label>

                <div class="input-row">

                    <input
                        type="text"
                        id="modelId"
                        placeholder="เช่น abc123"
                        autocomplete="off"
                    />

                    <button
                        class="copy-btn"
                        id="copyModelBtn"
                        title="Copy Model ID"
                    >
                        ⧉
                    </button>

                </div>

            </div>


            <!-- School ID -->

            <div class="field">

                <label class="field-label">
                    School ID
                </label>

                <input
                    type="text"
                    id="schoolId"
                    placeholder="School ID"
                    autocomplete="off"
                />

            </div>


            <!-- Name ID -->

            <div class="field">

                <label class="field-label">
                    Name ID
                </label>

                <input
                    type="text"
                    id="nameId"
                    placeholder="Name ID"
                    autocomplete="off"
                />

            </div>

        </div>


        <div class="save-row">

            <button
                class="save-btn"
                id="saveBtn"
            >
                SAVE
            </button>

        </div>

    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer-caption">
        Mini MicroKit PT-L V1.0 | AI Vision System
    </div>

</div>


<script>
/* =========================================================
   V6 JAVASCRIPT
   ========================================================= */


/* =========================================================
   CONFIG
   ========================================================= */

const MQTT_HOST = "broker.emqx.io";
const MQTT_PORT = 8084;

const GRAPH_POINTS = 30;

/*
 * Important performance optimization:
 * AI prediction can continue normally,
 * but graph drawing is limited to around 6–7 FPS.
 */
const GRAPH_UPDATE_MS = 150;

const MQTT_SEND_INTERVAL = 1000;


/* =========================================================
   DOM
   ========================================================= */

const video =
    document.getElementById("camera");

const cameraPlaceholder =
    document.getElementById("cameraPlaceholder");

const liveBadge =
    document.getElementById("liveBadge");

const resultText =
    document.getElementById("resultText");

const resultSub =
    document.getElementById("resultSub");

const confidenceValue =
    document.getElementById("confidenceValue");

const chartLine =
    document.getElementById("chartLine");

const chartArea =
    document.getElementById("chartArea");

const chartDot =
    document.getElementById("chartDot");

const chartEmpty =
    document.getElementById("chartEmpty");

const topicText =
    document.getElementById("topicText");

const modelIdInput =
    document.getElementById("modelId");

const schoolIdInput =
    document.getElementById("schoolId");

const nameIdInput =
    document.getElementById("nameId");

const runBtn =
    document.getElementById("runBtn");

const stopBtn =
    document.getElementById("stopBtn");

const switchCameraBtn =
    document.getElementById("switchCameraBtn");

const saveBtn =
    document.getElementById("saveBtn");

const themeBtn =
    document.getElementById("themeBtn");

const topTestBtn =
    document.getElementById("topTestBtn");

const copyModelBtn =
    document.getElementById("copyModelBtn");


/* =========================================================
   STATE
   ========================================================= */

let model = null;

let modelURL = "";

let webcamStream = null;

let cameraRunning = false;

let predictionBusy = false;

let cameraFacingMode = "user";

let mqttClient = null;

let mqttConnected = false;

let lastSentTime = 0;

let lastGraphUpdate = 0;

let animationFrameId = null;

let predictionTimer = null;


/* =========================================================
   GRAPH STATE
   ========================================================= */

let confidenceHistory =
    new Array(GRAPH_POINTS).fill(0);


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadSavedSettings() {

    const savedModel =
        localStorage.getItem("ai_model_id");

    const savedSchool =
        localStorage.getItem("ai_school_id");

    const savedName =
        localStorage.getItem("ai_name_id");

    const savedTheme =
        localStorage.getItem("ai_theme");


    if (savedModel) {
        modelIdInput.value =
            savedModel;
    }

    if (savedSchool) {
        schoolIdInput.value =
            savedSchool;
    }

    if (savedName) {
        nameIdInput.value =
            savedName;
    }


    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        themeBtn.textContent = "☀️";

    } else {

        document.body.classList.remove("dark");

        themeBtn.textContent = "🌙";
    }
}


/* =========================================================
   THEME
   ========================================================= */

function toggleTheme() {

    const dark =
        document.body.classList.toggle("dark");

    localStorage.setItem(
        "ai_theme",
        dark ? "dark" : "light"
    );

    themeBtn.textContent =
        dark ? "☀️" : "🌙";
}

themeBtn.addEventListener(
    "click",
    toggleTheme
);


/* =========================================================
   SAVE SETTINGS
   ========================================================= */

function saveSettings() {

    const modelId =
        modelIdInput.value.trim();

    const schoolId =
        schoolIdInput.value.trim();

    const nameId =
        nameIdInput.value.trim();


    localStorage.setItem(
        "ai_model_id",
        modelId
    );

    localStorage.setItem(
        "ai_school_id",
        schoolId
    );

    localStorage.setItem(
        "ai_name_id",
        nameId
    );


    updateTopic();


    /*
     * Reload model if Model ID changed.
     */

    if (modelId) {

        loadModel()
            .catch(error => {

                console.error(
                    "Model loading error:",
                    error
                );

                resultText.textContent =
                    "โหลดโมเดลไม่สำเร็จ";

                resultSub.textContent =
                    "ตรวจสอบ Model ID";

            });

    }


    /*
     * Reconnect MQTT using
     * new School / Name IDs.
     */

    connectMQTT();


    showMessage(
        "บันทึกการตั้งค่าแล้ว"
    );
}

saveBtn.addEventListener(
    "click",
    saveSettings
);


/* =========================================================
   COPY MODEL ID
   ========================================================= */

copyModelBtn.addEventListener(

        if (!value) return;

            );

/* =========================================================
   MODEL URL
   ========================================================= */

function buildModelURL() {

    const id =
        modelIdInput.value.trim();

    if (!id) {
        return "";
    }

    return `https://teachablemachine.withgoogle.com/models/${id}/`;
}


/* =========================================================
   LOAD MODEL
   ========================================================= */

async function loadModel() {

    const baseURL =
        buildModelURL();

    if (!baseURL) {

        resultText.textContent =
            "ยังไม่มี Model ID";

        resultSub.textContent =
            "กรอก Model ID แล้วกด SAVE";

        return false;
    }


    resultText.textContent =
        "กำลังโหลดโมเดล...";

    resultSub.textContent =
        "Loading Teachable Machine";


    modelURL = baseURL;


    const modelURLJSON =
        modelURL + "model.json";

    const metadataURL =
        modelURL + "metadata.json";


    model =
        await tmImage.load(
            modelURLJSON,
            metadataURL
        );


    resultText.textContent =
        "พร้อมใช้งาน";

    resultSub.textContent =
        `${model.getTotalClasses()} classes`;

    return true;
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

    if (cameraRunning) {
        return;
    }


    try {

        webcamStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode:
                        cameraFacingMode,

                    width: {
                        ideal: 224
                    },

                    height: {
                        ideal: 224
                    }
                },

                audio: false

            });


        video.srcObject =
            webcamStream;


        await video.play();


        cameraRunning = true;

        cameraPlaceholder.style.display =
            "none";

        liveBadge.style.display =
            "block";


        runBtn.classList.add(
            "running"
        );

        runBtn.innerHTML =
            "● Running";


        resultSub.textContent =
            "AI is analyzing camera";


        /*
         * Start prediction loop.
         */

        startPredictionLoop();

    } catch (error) {

        console.error(
            "Camera error:",
            error
        );


        cameraRunning = false;

        cameraPlaceholder.style.display =
            "flex";

        liveBadge.style.display =
            "none";


        resultText.textContent =
            "เปิดกล้องไม่ได้";

        resultSub.textContent =
            "อนุญาต Camera และใช้ HTTPS/localhost";

    }
}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

    cameraRunning = false;

    predictionBusy = false;


    if (predictionTimer) {

        clearTimeout(
            predictionTimer
        );

        predictionTimer = null;
    }


    if (animationFrameId) {

        cancelAnimationFrame(
            animationFrameId
        );

        animationFrameId = null;
    }


    if (webcamStream) {

        webcamStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        webcamStream = null;
    }


    video.srcObject = null;


    cameraPlaceholder.style.display =
        "flex";

    liveBadge.style.display =
        "none";


    runBtn.classList.remove(
        "running"
    );

    runBtn.innerHTML =
        "▶ Running";


    resetGraph();


    resultText.textContent =
        "หยุดการทำงาน";

    resultSub.textContent =
        "Camera stopped";


    /*
     * Preserve V5 behavior:
     * reload page after stopping.
     */

    setTimeout(() => {

        location.reload();

    }, 250);
}


runBtn.addEventListener(
    "click",
    async () => {

        /*
         * Load model automatically
         * if it has not been loaded.
         */

        if (!model) {

            const loaded =
                await loadModel();

            if (!loaded) {
                return;
            }
        }


        await startCamera();

    }
);


stopBtn.addEventListener(
    "click",
    stopCamera
);


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

switchCameraBtn.addEventListener(
    "click",
    async () => {

        if (!cameraRunning) {

            cameraFacingMode =
                cameraFacingMode === "user"
                    ? "environment"
                    : "user";

            return;
        }


        cameraFacingMode =
            cameraFacingMode === "user"
                ? "environment"
                : "user";


        if (webcamStream) {

            webcamStream
                .getTracks()
                .forEach(track => {
                    track.stop();
                });

            webcamStream = null;
        }


        try {

            webcamStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode:
                            cameraFacingMode,

                        width: {
                            ideal: 224
                        },

                        height: {
                            ideal: 224
                        }
                    },

                    audio: false

                });


            video.srcObject =
                webcamStream;

            await video.play();

        } catch (error) {

            console.error(
                "Camera switch error:",
                error
            );

        }
    }
);


/* =========================================================
   PREDICTION LOOP
   ========================================================= */

function startPredictionLoop() {

    if (predictionTimer) {

        clearTimeout(
            predictionTimer
        );
    }


    async function loop() {

        if (!cameraRunning) {
            return;
        }


        /*
         * Prevent overlapping
         * model.predict() calls.
         */

        if (!predictionBusy) {

            predictionBusy = true;

            try {

                await predict();

            } catch (error) {

                console.error(
                    "Prediction error:",
                    error
                );

            } finally {

                predictionBusy = false;

            }
        }


        /*
         * Schedule next prediction
         * without stacking promises.
         */

        predictionTimer =
            setTimeout(
                loop,
                30
            );
    }


    loop();
}


/* =========================================================
   PREDICTION
   ========================================================= */

async function predict() {

    if (!model) {
        return;
    }

    if (!cameraRunning) {
        return;
    }


    if (
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {
        return;
    }


    const predictions =
        await model.predict(
            video,
            false
        );


    if (
        !predictions ||
        predictions.length === 0
    ) {
        return;
    }


    let bestPrediction =
        predictions[0];


    for (
        let i = 1;
        i < predictions.length;
        i++
    ) {

        if (
            predictions[i].probability >
            bestPrediction.probability
        ) {

            bestPrediction =
                predictions[i];

        }
    }


    const label =
        bestPrediction.className;

    const confidence =
        bestPrediction.probability;


    /*
     * Update result text.
     */

    resultText.textContent =
        label;


    confidenceValue.textContent =
        `${(confidence * 100).toFixed(1)}%`;


    resultSub.textContent =
        "AI Vision Detection";


    /*
     * Graph history.
     */

    confidenceHistory.push(
        confidence
    );


    if (
        confidenceHistory.length >
        GRAPH_POINTS
    ) {

        confidenceHistory.shift();

    }


    /*
     * Graph rendering is intentionally
     * throttled to reduce lag.
     */

    const now =
        performance.now();


    if (
        now - lastGraphUpdate >=
        GRAPH_UPDATE_MS
    ) {

        lastGraphUpdate = now;

        drawGraph();

    }


    /*
     * MQTT is throttled independently.
     */

    if (
        mqttConnected &&
        Date.now() - lastSentTime >=
        MQTT_SEND_INTERVAL
    ) {

        sendToESP32(
            label,
            confidence
        );

        lastSentTime =
            Date.now();
    }
}


/* =========================================================
   GRAPH
   ========================================================= */

function drawGraph() {

    const width = 300;
    const height = 100;


    const values =
        confidenceHistory;


    if (
        !values ||
        values.length === 0
    ) {
        return;
    }


    let linePath = "";

    let areaPath = "";


    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        const x =
            values.length === 1
                ? 0
                : (
                    i /
                    (values.length - 1)
                ) * width;


        const value =
            Math.max(
                0,
                Math.min(
                    1,
                    values[i]
                )
            );


        const y =
            height -
            (value * height);


        if (i === 0) {

            linePath +=
                `M ${x} ${y}`;

        } else {

            linePath +=
                ` L ${x} ${y}`;

        }
    }


    /*
     * Area path.
     */

    areaPath =
        `M 0 ${height} `;


    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        const x =
            values.length === 1
                ? 0
                : (
                    i /
                    (values.length - 1)
                ) * width;


        const value =
            Math.max(
                0,
                Math.min(
                    1,
                    values[i]
                )
            );


        const y =
            height -
            (value * height);


        areaPath +=
            `L ${x} ${y} `;
    }


    areaPath +=
        `L ${width} ${height} Z`;


    chartLine.setAttribute(
        "d",
        linePath
    );


    chartArea.setAttribute(
        "d",
        areaPath
    );


    /*
     * Dot on current confidence.
     */

    const lastIndex =
        values.length - 1;


    const lastX =
        values.length === 1
            ? 0
            : (
                lastIndex /
                (values.length - 1)
            ) * width;


    const lastValue =
        Math.max(
            0,
            Math.min(
                1,
                values[lastIndex]
            )
        );


    const lastY =
        height -
        (lastValue * height);


    chartDot.setAttribute(
        "cx",
        lastX
    );


    chartDot.setAttribute(
        "cy",
        lastY
    );


    chartEmpty.style.display =
        lastValue <= 0
            ? "block"
            : "none";
}


/* =========================================================
   RESET GRAPH
   ========================================================= */

function resetGraph() {

    confidenceHistory =
        new Array(
            GRAPH_POINTS
        ).fill(0);

    lastGraphUpdate = 0;

    chartLine.setAttribute(
        "d",
        ""
    );

    chartArea.setAttribute(
        "d",
        ""
    );

    chartDot.setAttribute(
        "cx",
        "0"
    );

    chartDot.setAttribute(
        "cy",
        "100"
    );

    chartEmpty.style.display =
        "block";

    confidenceValue.textContent =
        "0.0%";
}


/* =========================================================
   MQTT TOPIC
   ========================================================= */

function getMQTTTopic() {

    const schoolId =
        schoolIdInput.value.trim();

    const nameId =
        nameIdInput.value.trim();


    if (!schoolId || !nameId) {

        return "";

    }


    return `gelectronlab/${schoolId}/${nameId}/status`;
}


/* =========================================================
   UPDATE TOPIC UI
   ========================================================= */

function updateTopic() {

    const topic =
        getMQTTTopic();


    if (topic) {

        topicText.textContent =
            `MQTT: ${topic}`;

    } else {

        topicText.textContent =
            "MQTT: not configured";

    }
}


/* =========================================================
   MQTT CONNECT
   ========================================================= */

function connectMQTT() {

    const topic =
        getMQTTTopic();


    if (!topic) {

        mqttConnected = false;

        topicText.textContent =
            "MQTT: not configured";

        return;

    }


    try {

        /*
         * Disconnect previous client.
         */

        if (
            mqttClient &&
            mqttClient.isConnected()
        ) {

            mqttClient.disconnect();

        }


        const clientId =
            "AI_CAMERA_" +
            Math.random()
                .toString(16)
                .substring(2, 10);


        mqttClient =
            new Paho.MQTT.Client(
                MQTT_HOST,
                MQTT_PORT,
                "/mqtt",
                clientId
            );


        mqttClient.onConnectionLost =
            function(responseObject) {

                mqttConnected = false;

                topicText.textContent =
                    "MQTT: disconnected";


                if (
                    responseObject &&
                    responseObject.errorMessage
                ) {

                    console.warn(
                        "MQTT lost:",
                        responseObject.errorMessage
                    );

                }

            };


        mqttClient.onMessageArrived =
            function(message) {

                console.log(
                    "MQTT message:",
                    message.payloadString
                );

            };


        mqttClient.connect({

            useSSL: true,

            timeout: 5,

            keepAliveInterval: 30,

            onSuccess: function() {

                mqttConnected = true;

                topicText.textContent =
                    `MQTT: connected`;

                console.log(
                    "MQTT connected"
                );

            },

            onFailure: function(error) {

                mqttConnected = false;

                topicText.textContent =
                    "MQTT: connection failed";

                console.error(
                    "MQTT connection failed:",
                    error
                );

            }

        });

    } catch (error) {

        mqttConnected = false;

        topicText.textContent =
            "MQTT: connection error";

        console.error(
            "MQTT error:",
            error
        );

    }
}


/* =========================================================
   SEND TO ESP32
   ========================================================= */

function sendToESP32(
    label,
    confidence
) {

    if (
        !mqttClient ||
        !mqttConnected
    ) {
        return;
    }


    const topic =
        getMQTTTopic();


    if (!topic) {
        return;
    }


    const payload = {

        label: label,

        confidence:
            Number(
                confidence.toFixed(4)
            ),

        percent:
            Number(
                (
                    confidence * 100
                ).toFixed(1)
            ),

        timestamp:
            Date.now()

    };


    try {

        const message =
            new Paho.MQTT.Message(
                JSON.stringify(payload)
            );


        message.destinationName =
            topic;


        mqttClient.send(
            message
        );


    } catch (error) {

        console.error(
            "MQTT send error:",
            error
        );

    }
}


/* =========================================================
   TEST CONNECTION
   ========================================================= */

async function testConnection() {

    const oldText =
        topTestBtn.textContent;


    topTestBtn.textContent =
        "⏳";


    try {

        /*
         * Check model first.
         */

        if (!model) {

            await loadModel();

        }


        /*
         * MQTT connection.
         */

        connectMQTT();


        showMessage(
            "กำลังทดสอบระบบ..."
        );


        setTimeout(() => {

            if (mqttConnected) {

                showMessage(
                    "ระบบเชื่อมต่อพร้อมใช้งาน"
                );

            } else {

                showMessage(
                    "ตรวจสอบ MQTT / การตั้งค่า"
                );

            }

        }, 1200);


    } catch (error) {

        console.error(
            "Test error:",
            error
        );

        showMessage(
            "Test ไม่สำเร็จ"
        );

    } finally {

        setTimeout(() => {

            topTestBtn.textContent =
                oldText;

        }, 1200);

    }
}


/*
 * V6:
 * Test button is now in HEADER.
 */

topTestBtn.addEventListener(
    "click",
    testConnection
);


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(message) {

    resultSub.textContent =
        message;

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

function initialize() {

    loadSavedSettings();

    updateTopic();

    resetGraph();


    /*
     * Do not automatically start
     * the camera.
     */

    resultText.textContent =
        "รอการตรวจจับ";

    resultSub.textContent =
        "กด Running เพื่อเริ่มกล้อง";


    /*
     * Attempt MQTT connection
     * if School ID + Name ID exist.
     */

    if (
        schoolIdInput.value.trim() &&
        nameIdInput.value.trim()
    ) {

        connectMQTT();

    }

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
    "load",
    initialize
);


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        /*
         * Do not perform unnecessary
         * graph rendering while page
         * is hidden.
         */

        if (
            document.hidden
        ) {

            lastGraphUpdate =
                performance.now();

        }

    }
);


/* =========================================================
   PREVENT DOUBLE TOUCH / ZOOM
   ========================================================= */

document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    }
);

</script>
