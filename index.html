<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

<style>
:root{
  --bg:#ffffff;
  --bg-gradient:linear-gradient(135deg,#ffffff 0%,#f8fff9 34%,#d4f3da 100%);
  --card:rgba(255,255,255,.95);
  --text:#111827;
  --muted:#667085;
  --green:#21a957;
  --green-strong:#159447;
  --border:#dce7e0;
  --button:#ffffff;
  --button-border:#d4e5da;
  --button-text:#111111;
  --shadow:0 12px 30px rgba(31,73,45,.08);
  --video-border:#d8e6dd;
  --status-bg:rgba(255,255,255,.90);
}
[data-theme='dark']{
  --bg:#050a10;
  --bg-gradient:
    radial-gradient(circle at 86% 4%,rgba(40,176,91,.13),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(40,176,91,.07),transparent 30%),
    linear-gradient(145deg,#03070d 0%,#07111b 54%,#081a14 100%);
  --card:rgba(10,17,26,.95);
  --text:#f5f7fa;
  --muted:#a2afbf;
  --green:#50df83;
  --green-strong:#38c96d;
  --border:#1d2b3a;
  --button:#111b27;
  --button-border:#263646;
  --button-text:#f4f7f6;
  --shadow:0 14px 38px rgba(0,0,0,.28);
  --video-border:#253341;
  --status-bg:rgba(8,18,17,.90);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  color:var(--text);background:var(--bg-gradient);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",Arial,sans-serif;
  transition:background .25s,color .25s;
}
button,input{font:inherit}
button{touch-action:manipulation}

/* The page is deliberately one viewport tall. JS below calculates a fit scale
   so the same complete dashboard remains visible on phones, tablets and PCs. */
.viewport{
  width:100vw;height:100dvh;overflow:hidden;
  display:flex;justify-content:center;align-items:flex-start;
}
.app-container{
  width:min(100%,980px);
  height:auto;
  flex:none;
  margin:0 auto;
  padding:22px 22px 16px;
  display:flex;flex-direction:column;gap:14px;
  transform-origin:top center;
  will-change:transform;
}

/* Header */
.app-header{display:flex;align-items:flex-start;justify-content:space-between;padding:3px 2px 0}
.brand h1{
  margin:0;font-size:clamp(2rem,4.2vw,3.05rem);line-height:1;
  letter-spacing:-1.8px;font-weight:800;
  background:linear-gradient(100deg,#168c45 0%,#36bf68 55%,#74d98e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
[data-theme='dark'] .brand h1{
  background:linear-gradient(100deg,#50df83 0%,#70e69a 55%,#a4efba 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{margin:7px 0 0;color:var(--muted);font-size:1.08rem;font-weight:500}
.theme-toggle{
  width:54px;height:54px;flex:0 0 54px;border-radius:17px;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;
}
.theme-toggle svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.theme-toggle:active{transform:scale(.96)}

/* Cards */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(14px);
}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.analysis-card{min-height:145px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:.9rem;color:var(--muted);font-weight:600}
.result-val{
  margin:8px 0 0;font-size:clamp(1.45rem,3vw,2rem);line-height:1.05;
  font-weight:800;letter-spacing:-.6px;color:var(--text);word-break:break-word;
}
.status-line{font-size:.9rem;color:var(--muted)}
.status-line b{color:var(--green-strong);font-weight:700}
.send-icon{width:24px;height:24px;fill:var(--green-strong);vertical-align:middle}
.accuracy-card{display:flex;flex-direction:column;justify-content:space-between}
#conf-text{display:block;margin-top:5px;font-size:clamp(2rem,4.6vw,3rem);font-weight:850;line-height:1;letter-spacing:-1.5px;color:var(--green-strong)}
.sparkline{width:100%;height:36px;margin-top:8px}
.sparkline path{fill:none;stroke:var(--green-strong);stroke-width:2.2;stroke-linecap:round}
.sparkline .area{fill:rgba(33,169,87,.10);stroke:none}

/* Camera */
.camera-card{padding:18px}
.camera-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.camera-title{font-size:1.1rem;font-weight:800;letter-spacing:-.3px}
.topic{font-size:.9rem;font-weight:700;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-box{
  width:100%;aspect-ratio:16/10;min-height:0;background:#050807;
  border:1px solid var(--video-border);border-radius:18px;overflow:hidden;
  position:relative;display:flex;align-items:center;justify-content:center;
}
video{width:100%;height:100%;object-fit:cover}
video.front-cam{transform:scaleX(-1)}
video.back-cam{transform:scaleX(1)}
.live-pill{
  position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-radius:13px;background:rgba(255,255,255,.94);color:#10151b;
  font-weight:700;font-size:.85rem;box-shadow:0 5px 18px rgba(0,0,0,.16)
}
.live-dot{width:9px;height:9px;border-radius:50%;background:#2fc56d;box-shadow:0 0 0 4px rgba(47,197,109,.13)}
.btn-float-switch{
  position:absolute;top:14px;right:14px;z-index:10;width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);
  color:#111;border:1px solid rgba(0,0,0,.08);box-shadow:0 5px 18px rgba(0,0,0,.14);cursor:pointer
}
.btn-float-switch svg{width:22px;height:22px;fill:currentColor}
.btn-float-switch:active{transform:scale(.94)}
.controls,.bottom-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.controls{margin-top:14px}.bottom-controls{margin-top:12px}
.action-btn{
  min-height:58px;border-radius:15px;border:1px solid var(--button-border);
  background:var(--button);color:var(--button-text);display:flex;align-items:center;justify-content:center;
  gap:12px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 5px 14px rgba(30,80,45,.035);
  transition:transform .15s,border-color .15s,background .15s
}
.action-btn:active{transform:scale(.98)}
.action-btn svg{width:24px;height:24px;fill:currentColor;stroke:currentColor}
[data-theme='light'] .btn-stop{background:#fffafa;border-color:#efd8d8}
[data-theme='light'] .btn-start{background:#fbfffc}
[data-theme='dark'] .action-btn{background:#101a25;border-color:#263545;color:#f4f7f6}
[data-theme='dark'] .btn-stop{background:#111a25}.btn-secondary{min-height:54px}

/* Settings */
.settings-card{padding:18px}
.section-title{font-size:1rem;font-weight:750;margin-bottom:16px}
.field{margin-bottom:13px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field-label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:7px}
input{
  width:100%;height:48px;padding:0 14px;border-radius:13px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);outline:none;font-size:.95rem;
}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(33,169,87,.12)}
input::placeholder{color:var(--muted);opacity:.75}
.save-btn{
  width:100%;min-height:55px;margin-top:3px;border-radius:15px;border:1px solid rgba(20,130,62,.12);
  background:linear-gradient(100deg,#39b765,#76cf72);color:#111;font-weight:800;font-size:1rem;
  display:flex;align-items:center;justify-content:center;gap:11px;cursor:pointer;box-shadow:0 8px 20px rgba(33,169,87,.16)
}
.save-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}
[data-theme='dark'] .save-btn{background:linear-gradient(100deg,#173723,#1f5631);color:#fff;border-color:#2b6b3e;box-shadow:none}

/* Footer */
.system-bar{
  min-height:58px;border-radius:17px;padding:0 16px;background:var(--status-bg);border:1px solid var(--border);
  box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;color:var(--green-strong)
}
.system-item{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:650}
.system-item:last-child{justify-content:flex-end}.system-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.divider{width:1px;height:23px;background:var(--border)}
.footer-note{text-align:center;color:var(--muted);font-size:.78rem;padding:0 0 2px}

/* On very narrow phones, retain the same visual hierarchy while reducing the
   natural size before the final viewport-fit calculation. */
@media (max-width:520px){
  .app-container{padding:16px 14px 12px;gap:10px}
  .card,.camera-card,.settings-card{border-radius:18px;padding:14px}
  .analysis-grid{gap:10px}.analysis-card{min-height:124px}
  .brand p{font-size:.92rem}.theme-toggle{width:50px;height:50px;flex-basis:50px}
  .camera-head{margin-bottom:10px}.video-box{border-radius:15px}
  .live-pill{top:10px;left:10px;padding:8px 11px}.btn-float-switch{top:10px;right:10px;width:44px;height:44px}
  .controls,.bottom-controls{gap:9px}.action-btn{min-height:50px;font-size:.92rem}
  .field-row{gap:9px}.settings-card{padding:14px}.section-title{margin-bottom:12px}
  .field{margin-bottom:9px}.field-label{margin-bottom:5px}input{height:44px}
  .save-btn{min-height:49px}.system-bar{min-height:50px}.footer-note{font-size:.7rem}
}
@media (max-width:380px){
  .brand h1{font-size:2rem}.brand p{font-size:.82rem}
  .analysis-card{min-height:114px}.result-val{font-size:1.28rem}#conf-text{font-size:2rem}
  .eyebrow,.status-line{font-size:.72rem}.action-btn{gap:7px;font-size:.82rem}.action-btn svg{width:20px;height:20px}
}
</style>
</head>

<script>
function fitToViewport(){
  const viewport=document.querySelector(".viewport");
  const app=document.querySelector(".app-container");
  if(!viewport||!app)return;
  app.style.transform="none";
  const naturalW=app.offsetWidth;
  const naturalH=app.scrollHeight;
  const vw=viewport.clientWidth;
  const vh=viewport.clientHeight;
  const scale=Math.min(1, vw/naturalW, vh/naturalH);
  app.style.transform=`scale(${Math.max(scale,0.58)})`;
}
let fitTimer;
function scheduleFit(){clearTimeout(fitTimer);fitTimer=setTimeout(fitToViewport,40)}
window.addEventListener("resize",scheduleFit,{passive:true});
window.addEventListener("orientationchange",()=>setTimeout(fitToViewport,180),{passive:true});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitToViewport);
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;

    let savedId = localStorage.getItem("saved_model_id") || "";
    if (savedId) document.getElementById("model-input").value = savedId;

    let savedSchool = localStorage.getItem("saved_school_id") || "PTL-School";
    document.getElementById("school-input").value = savedSchool;

    let savedNameId = localStorage.getItem("saved_name_id") || "group1";
    document.getElementById("name-input").value = savedNameId;

    updateTopicDisplay(savedSchool, savedNameId);
    requestAnimationFrame(fitToViewport);
});

function saveSettings() {
    const modelVal = document.getElementById("model-input").value.trim();
    const schoolVal = document.getElementById("school-input").value.trim() || "PTL-School";
    const nameVal = document.getElementById("name-input").value.trim() || "group1";
    
    if (!modelVal) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }

    localStorage.setItem("saved_model_id", modelVal);
    localStorage.setItem("saved_school_id", schoolVal);
    localStorage.setItem("saved_name_id", nameVal);
    
    updateTopicDisplay(schoolVal, nameVal);
    alert("บันทึกค่าเรียบร้อย! กำลังเชื่อมต่อ ระบบใหม่...");
    
    initMQTT();
}

function updateTopicDisplay(schoolId, nameId) {
    document.getElementById("current-group-label").textContent = "Topic : " + schoolId + "/" + nameId;
}

const mqttHost = "broker.emqx.io";
const mqttPort = 8084; 

let mqttClient = null;
let isConnecting = false;

function getDynamicTopic() {
    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    return "gelectronlab/" + schoolId + "/" + nameId + "/status";
}

function initMQTT() {
    if (isConnecting) return;
    isConnecting = true;

    if (mqttClient) {
        try {
            mqttClient.onConnectionLost = null;
            if (mqttClient.isConnected()) {
                mqttClient.disconnect();
            }
        } catch(e) { console.log(e); }
    }

    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    let uniqueClientId = "WebClient-" + schoolId + "-" + nameId + "-" + Date.now() + "-" + Math.floor(Math.random() * 10000);
    
    mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), uniqueClientId);

    mqttClient.onConnectionLost = function (responseObject) {
        isConnecting = false;
        document.getElementById("esp-status").textContent = "Disconnected";
        document.getElementById("esp-status").style.color = "#ef4444";
        
        if (responseObject.errorCode !== 0) {
            console.log("MQTT Lost: " + responseObject.errorMessage);
            setTimeout(initMQTT, 5000);
        }
    };

    try {
        mqttClient.connect({
            onSuccess: function() {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Connected " + nameId + "";
                document.getElementById("esp-status").style.color = "#2563eb";
                console.log("Connected Successfully as: " + uniqueClientId);
            },
            onFailure: function(message) {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Failed";
                document.getElementById("esp-status").style.color = "#ef4444";
                console.log("Connect Failed: " + message.errorMessage);
                setTimeout(initMQTT, 5000);
            },
            useSSL: true,
            timeout: 5,
            keepAliveInterval: 30
        });
    } catch(e) {
        isConnecting = false;
        console.error("MQTT Exception: ", e);
    }
}

initMQTT();

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
}

let model = null;
let running = false;
let lastSentTime = 0;
let currentFacingMode = "user";

async function sendToESP32(className) {
    if (Date.now() - lastSentTime < 1000) return;
    lastSentTime = Date.now();

    if (mqttClient && mqttClient.isConnected()) {
        let topic = getDynamicTopic();
        let message = new Paho.MQTT.Message(className);
        message.destinationName = topic;
        mqttClient.send(message);
        
        let nameId = localStorage.getItem("saved_name_id") || "group1";
        document.getElementById("esp-status").textContent = "Sent " + nameId + "";
        document.getElementById("esp-status").style.color = "#16a34a";
    }
}

async function testConnection() {
    await sendToESP32("Test_Class");
    alert("ส่งสัญญาณทดสอบไปยัง Mini MicroKit PT-L เรียบร้อย!");
}

async function startCamera(facing) {
    if (window.currentStream) {
        window.currentStream.getTracks().forEach(track => track.stop());
    }

    const videoElement = document.getElementById("video");
    if (facing === "user") {
        videoElement.className = "front-cam";
    } else {
        videoElement.className = "back-cam";
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 224 }, height: { ideal: 224 } }
    });
    
    window.currentStream = stream;
    videoElement.srcObject = stream;
}

async function switchCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    if (running) {
        try {
            await startCamera(currentFacingMode);
        } catch(e) {
            alert("ไม่สามารถสลับกล้องได้: " + e.message);
        }
    } else {
        alert(currentFacingMode === "user" ? "ตั้งค่าเป็น: กล้องหน้า" : "ตั้งค่าเป็น: กล้องหลัง");
    }
}

document.getElementById("start-btn").onclick = async () => {
    let savedId = localStorage.getItem("saved_model_id") || document.getElementById("model-input").value.trim();
    if (!savedId) {
        alert("กรุณากรอกและกดบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    
    try {
        document.getElementById("start-label").textContent = "Loading...";
        const MODEL_URL = `https://teachablemachine.withgoogle.com/models/${savedId}/`;
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        await startCamera(currentFacingMode);
        
        running = true;
        document.getElementById("start-label").textContent = "Running...";
        loop();
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
        document.getElementById("start-label").textContent = "Start AI";
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pctVal = best.probability * 100;
        let pctStr = pctVal.toFixed(1) + "%";
        
        let confElem = document.getElementById("conf-text");
        confElem.textContent = pctStr;

        if (pctVal > 90) {
            confElem.style.color = "#16a34a";
        } else {
            confElem.style.color = "#ef4444";
        }
        
        if (best.probability > 0.90) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        } else {
            document.getElementById("name").username = "Uncertain...";
            document.getElementById("name").textContent = "Uncertain...";
            await sendToESP32("Unknown"); 
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>
