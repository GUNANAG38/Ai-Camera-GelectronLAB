<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera WiFi</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<style>
:root {
    --bg-color: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

[data-theme='dark'] {
    --bg-color: #0b0f19;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --border: #334155;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
}

* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden; /* ล็อกไม่ให้เลื่อนหน้าจอเด็ดขาด */
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 850px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: var(--shadow);
}

.app-title { font-size: 1rem; font-weight: 700; color: var(--text-main); }
.menu-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); padding: 4px 8px; }

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
}

.video-box {
    width: 100%;
    height: 38vh;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 6px;
}
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

.controls { margin-top: 8px; display: flex; gap: 8px; }
button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
}
.btn-start { background: var(--accent); color: white; flex: 1; }
.btn-stop { background: #ef4444; color: white; flex: 1; }

.result-val { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin: 2px 0; }

/* Modal Popup สำหรับตั้งค่า (ซ่อนไว้ก่อน) */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}
.modal-content {
    background: var(--card-bg);
    border: 1px solid var(--border);
    width: 90%;
    max-width: 360px;
    padding: 16px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
.close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
</style>
</head>
<body>

<div class="app-container">
    <!-- แถบหัวข้อด้านบน พร้อมปุ่มเมนูจุดสามจุด -->
    <div class="header-bar">
        <div>
            <div class="app-title">AI Camera WiFi</div>
            <div style="font-size: 0.7rem; color: var(--text-muted);">MiniMicroKit_PT-L</div>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    </div>

    <!-- ส่วนแสดงกล้อง -->
    <section class="card" style="flex: 1; justify-content: center;">
        <div class="video-box">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div class="controls">
            <button class="btn-start" id="start-btn">Start AI</button>
            <button class="btn-stop" id="stop-btn">Stop</button>
        </div>
    </section>

    <!-- ส่วนแสดงผลลัพธ์ -->
    <section class="card">
        <div style="color: var(--text-muted); font-size: 0.75rem; font-weight: 600;">AI Analysis Data</div>
        <div class="result-val" id="name">--</div>
        <div style="font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between;">
            <span>Board Status: <b id="esp-status">Disconnected</b></span>
            <span id="conf-text">0.0%</span>
        </div>
    </section>
</div>

<!-- Popup เมนูตั้งค่า (ซ่อน/แสดงได้) -->
<div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>ตั้งค่าระบบ</span>
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        
        <div>
            <div style="font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted);">Teachable Model ID</div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="model-input" placeholder="เช่น my-model-xxxx" style="flex:1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main);">
                <button onclick="saveModelId()" style="background: var(--accent); color: white; border-radius: 6px; padding: 8px 10px;">บันทึก</button>
            </div>
        </div>

        <button onclick="toggleTheme()" style="background: var(--border); color: var(--text-main); border-radius: 6px; padding: 10px; font-weight: 600;">สลับธีม (มืด / สว่าง)</button>
        <button onclick="testConnection()" style="background: #10b981; color: white; border-radius: 6px; padding: 10px; font-weight: 600;">Test WiFi (ทดสอบบอร์ด)</button>
    </div>
</div>

<script>
// จัดการธีม (มืด / สว่าง)
function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
}

// โหลดค่าธีมเดิมที่เคยเลือกไว้
window.onload = () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;

    let savedId = localStorage.getItem("saved_model_id") || "";
    if (savedId) {
        document.getElementById("model-input").value = savedId;
    }
};

// เปิด-ปิด ป๊อปอัพเมนู
function toggleMenu() {
    const modal = document.getElementById("settings-modal");
    modal.style.display = modal.style.display === "flex" ? "none" : "flex";
}

let savedId = localStorage.getItem("saved_model_id") || "";
let MODEL_URL = savedId ? `https://teachablemachine.withgoogle.com/models/${savedId}/` : "";

function saveModelId() {
    const val = document.getElementById("model-input").value.trim();
    if (!val) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }
    localStorage.setItem("saved_model_id", val);
    alert("บันทึก Model ID เรียบร้อยแล้ว!");
    location.reload();
}

let model = null;
let running = false;
let lastSentTime = 0;

async function sendToESP32(name) {
    if (Date.now() - lastSentTime < 1500) return;
    lastSentTime = Date.now();

    try {
        await fetch(`http://192.168.4.1/detect?name=${encodeURIComponent(name)}`, {
            method: 'GET',
            mode: 'no-cors'
        });
        document.getElementById("esp-status").textContent = "Connected";
        document.getElementById("esp-status").style.color = "#2563eb";
    } catch(e) {
        document.getElementById("esp-status").textContent = "Failed";
        document.getElementById("esp-status").style.color = "#ef4444";
    }
}

async function testConnection() {
    await sendToESP32("MaskOn");
    alert("ส่งสัญญาณทดสอบ MaskOn ไปที่บอร์ดแล้ว!");
}

document.getElementById("start-btn").onclick = async () => {
    savedId = localStorage.getItem("saved_model_id") || "";
    if (!savedId) {
        alert("กรุณากดปุ่มเมนู (⋮) เพื่อกรอกและบันทึก Model ID ก่อนครับ");
        toggleMenu();
        return;
    }
    try {
        MODEL_URL = `https://teachablemachine.withgoogle.com/models/${savedId}/`;
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 160 }, height: { ideal: 160 } }
        });
        document.getElementById("video").srcObject = stream;
        
        running = true;
        loop();
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pct = (best.probability * 100).toFixed(1);
        document.getElementById("conf-text").textContent = pct + "%";
        
        if (best.probability > 0.8) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>

</body>
</html>
