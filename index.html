<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Camera</title>
<!-- โหลด TensorFlow.js และ Teachable Machine รุ่นที่เสถียรที่สุด -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 12px;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.app-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
}
.video-box {
    width: 100%;
    height: 32vh;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 8px;
}
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.controls { margin-top: 8px; display: flex; gap: 8px; }
button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
}
.btn-start { background: var(--accent); color: white; flex: 1; }
.btn-stop { background: #ef4444; color: white; flex: 1; }
.btn-secondary { background: var(--border); color: var(--text-main); flex: 1; font-size: 0.78rem; margin-top: 6px; }
.result-val { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin: 4px 0; }
</style>
</head>
<body>

<div class="app-container">
    <!-- ส่วนตั้งค่า Model ID -->
    <section class="card">
        <div style="font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted);">Teachable Model ID</div>
        <div style="display: flex; gap: 6px;">
            <input type="text" id="model-input" placeholder="เช่น my-model-xxxx" style="flex:1; padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
            <button onclick="saveModelId()" style="background: var(--accent); color: white; border-radius: 6px; padding: 8px 12px;">บันทึก</button>
        </div>
    </section>

    <!-- ส่วนแสดงกล้อง -->
    <section class="card">
        <div style="font-weight: 700;">AI Camera WiFi</div>
        <div class="video-box">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div class="controls">
            <button class="btn-start" id="start-btn">Start AI</button>
            <button class="btn-stop" id="stop-btn">Stop</button>
        </div>
        <button class="btn-secondary" onclick="testConnection()">Test WiFi (ส่งค่าไปบอร์ด)</button>
    </section>

    <!-- ส่วนแสดงผลลัพธ์ -->
    <section class="card">
        <div style="color: var(--text-muted); font-weight: 600;">AI Analysis Data</div>
        <div class="result-val" id="name">--</div>
        <div style="font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: space-between;">
            <span>Board Status: <b id="esp-status">Disconnected</b></span>
            <span id="conf-text">0.0%</span>
        </div>
    </section>
</div>

<script>
let savedId = localStorage.getItem("saved_model_id") || "";
let MODEL_URL = savedId ? `https://teachablemachine.withgoogle.com/models/${savedId}/` : "";

window.onload = () => {
    if (savedId) {
        document.getElementById("model-input").value = savedId;
    }
};

function saveModelId() {
    const val = document.getElementById("model-input").value.trim();
    if (!val) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }
    localStorage.setItem("saved_model_id", val);
    alert("บันทึก Model ID เรียบร้อยแล้ว!");
    location.reload();
}

let model = null;
let running = false;
let lastSentTime = 0;

async function sendToESP32(name) {
    if (Date.now() - lastSentTime < 1500) return;
    lastSentTime = Date.now();

    try {
        await fetch(`http://192.168.4.1/detect?name=${encodeURIComponent(name)}`, {
            method: 'GET',
            mode: 'no-cors'
        });
        document.getElementById("esp-status").textContent = "Connected";
        document.getElementById("esp-status").style.color = "#2563eb";
    } catch(e) {
        document.getElementById("esp-status").textContent = "Failed";
        document.getElementById("esp-status").style.color = "#ef4444";
    }
}

async function testConnection() {
    await sendToESP32("MaskOn");
    alert("ส่งสัญญาณทดสอบ MaskOn ไปที่บอร์ดแล้ว!");
}

document.getElementById("start-btn").onclick = async () => {
    if (!savedId) {
        alert("กรุณากรอกและบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    try {
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 160 }, height: { ideal: 160 } }
        });
        const videoElement = document.getElementById("video");
        videoElement.srcObject = stream;
        
        running = true;
        loop();
        alert("AI เริ่มทำงานแล้ว!");
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pct = (best.probability * 100).toFixed(1);
        document.getElementById("conf-text").textContent = pct + "%";
        
        if (best.probability > 0.8) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>

</body>
</html>
