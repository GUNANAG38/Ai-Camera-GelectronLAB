<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera WiFi</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

[data-theme='dark'] {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --border: #334155;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
}

* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 480px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
}

.title-container { margin-bottom: 6px; }
.main-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
.sub-title { font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 1px; }

.camera-section { display: flex; flex-direction: column; justify-content: center; }
.video-box {
    width: 100%;
    height: 32vh;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

.controls { margin-top: 8px; display: flex; gap: 8px; }
.bottom-controls { margin-top: 6px; display: flex; gap: 8px; }

button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.2s;
}

.btn-start { background: var(--accent); color: white; flex: 1; }
.btn-stop { background: #ef4444; color: white; flex: 1; }
.btn-secondary { background: var(--border); color: var(--text-main); flex: 1; font-size: 0.78rem; }

.result-section { padding: 12px 16px; }
.label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.result-val { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin: 2px 0; line-height: 1.1; }
.conf-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
.status-text { margin-top: 6px; font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div class="app-container">
    <!-- ส่วนตั้งค่า Model ID สำหรับนักเรียน -->
    <section class="card">
        <div style="font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted);">Teachable Model ID</div>
        <div style="display: flex; gap: 6px;">
            <input type="text" id="model-input" placeholder="เช่น my-model-xxxx" style="flex:1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.8rem;">
            <button onclick="saveModelId()" style="padding: 8px 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600;">บันทึก</button>
        </div>
    </section>

    <!-- ส่วนแสดงกล้องและการควบคุม -->
    <section class="card camera-section">
        <div class="title-container">
            <span class="main-title">AI Camera WiFi</span>
            <span class="sub-title">MiniMicroKit_PT-L Board</span>
        </div>
        <div class="video-box">
            <video id="video" autoplay muted playsinline></video>
        </div>
        
        <div class="controls">
            <button class="btn-start" id="start">Start AI</button>
            <button class="btn-stop" id="stop">Stop</button>
        </div>
        
        <div class="bottom-controls">
            <button class="btn-secondary" onclick="testConnection()">Test WiFi</button>
            <button class="btn-secondary" onclick="toggleTheme()">Switch Theme</button>
        </div>
    </section>

    <!-- ส่วนแสดงผลลัพธ์ -->
    <section class="card result-section">
        <div class="label">AI Analysis Data</div>
        <div class="result-val" id="name">--</div>
        <div class="conf-bar"><div class="fill" id="fill"></div></div>
        <div class="status-text">
            <span>Board Status: <b id="esp-status">Disconnected</b></span>
            <span id="conf-text">0.0%</span>
        </div>
    </section>
</div>

<script>
function toggleTheme() {
    const body = document.body;
    body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
}

// จัดการเรื่อง Model ID ของนักเรียนแต่ละคน
let savedId = localStorage.getItem("saved_model_id") || "";
let MODEL_URL = savedId ? `https://teachablemachine.withgoogle.com/models/${savedId}/` : "";

window.onload = () => {
    if (savedId) {
        document.getElementById("model-input").value = savedId;
    }
};

function saveModelId() {
    const val = document.getElementById("model-input").value.trim();
    if (!val) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }
    localStorage.setItem("saved_model_id", val);
    alert("บันทึก Model ID เรียบร้อยแล้ว!");
    location.reload();
}

let model, running = false;
let lastSentTime = 0; 
const $ = id => document.getElementById(id);

async function sendToESP32(name) {
    if (Date.now() - lastSentTime < 1500) return;
    lastSentTime = Date.now();

    try {
        await fetch(`http://192.168.4.1/detect?name=${encodeURIComponent(name)}`, {
            method: 'GET',
            mode: 'no-cors'
        });
        $("esp-status").textContent = "Connected";
        $("esp-status").style.color = "var(--accent)";
    } catch(e) {
        $("esp-status").textContent = "Failed";
        $("esp-status").style.color = "#ef4444";
    }
}

async function testConnection() {
    await sendToESP32("Test_User");
    alert("ส่งสัญญาณทดสอบไปที่บอร์ดแล้ว!");
}

$("start").onclick = async () => {
    if (!savedId) {
        alert("กรุณากรอกและบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    try {
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        model = await tmImage.load(u + "model.json", u + "metadata.json");
    const stream = await navigator.mediaDevices.getUserMedia({
    video: { 
        facingMode: "user",
        width: { ideal: 224 },
        height: { ideal: 224 }
    }});
        $("video").srcObject = stream;
        running = true;
        loop();
    } catch(e) { 
        alert("ไม่สามารถเปิดกล้องได้ หรือลิงก์ Model ID ไม่ถูกต้อง"); 
    }
};

async function loop() {
    if (!running) return;
    const prediction = await model.predict($("video"), false);
    let best = prediction.sort((a, b) => b.probability - a.probability)[0];
    
    let pct = (best.probability * 100).toFixed(1);
    $("conf-text").textContent = pct + "%";
    
    if (best.probability > 0.8) {
        $("name").textContent = best.className;
        $("fill").style.width = pct + "%";
        await sendToESP32(best.className);
    }
    requestAnimationFrame(loop);
}

$("stop").onclick = () => { running = false; window.location.reload(); };
</script>
</body>
</html>
