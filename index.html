<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

<style>
:root{
  --bg:#ffffff;
  --bg-gradient:linear-gradient(145deg,#ffffff 0%,#f8fff9 38%,#d4f3da 100%);
  --card:rgba(255,255,255,.96); --text:#111827; --muted:#667085;
  --green:#21a957; --green-strong:#159447; --border:#dce7e0;
  --button:#f1f5f9; --button-border:#cbd5e1; --button-text:#0f172a;
  --shadow:0 6px 20px rgba(31,73,45,.06); --video-border:#d8e6dd;
  --status-bg:rgba(255,255,255,.9);
  --topic-color: #000000;
}

[data-theme='dark'] {
  --bg: #0f172a;
  --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
  --card: rgba(30, 41, 59, 0.96);
  --text: #f8fafc;
  --muted: #94a3b8;
  --green: #22c55e;
  --green-strong: #16a34a;
  --border: #334155;
  --button: #1e293b;
  --button-border: #475569;
  --button-text: #f8fafc;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  --video-border: #475569;
  --status-bg: rgba(30, 41, 59, 0.9);
  --topic-color: #ffffff;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
  overflow: hidden; background: var(--bg); background-image: var(--bg-gradient); color: var(--text);
  font-family: sans-serif; display: flex; justify-content: center; align-items: center;
}

.app-container {
  width: 100%; max-width: 480px; height: 100%; max-height: 100vh; max-height: 100dvh;
  padding: 4px 8px; display: flex; flex-direction: column; gap: 3px; justify-content: space-between;
}

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}

.video-box {
  width: 100%; 
  flex-grow: 1; /* ขยายขนาดกล้องให้เต็มพื้นที่ว่างอย่างพอดี */
  min-height: 160px; /* ขยายขนาดขั้นต่ำให้ใหญ่ขึ้นกว่าเดิม */
  max-height: 240px; /* จำกัดความสูงสูงสุดไม่ให้ล้นหน้าจอ */
  background: #000; border-radius: 6px;
  overflow: hidden; display: flex; justify-content: center; align-items: center;
  position: relative; border: 1px solid var(--video-border);
  margin-top: 2px; margin-bottom: 2px;
}
video { width: 100%; height: 100%; object-fit: cover; }
video.front-cam { transform: scaleX(-1); }
video.back-cam { transform: scaleX(1); }

.btn-float-switch {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(0, 0, 0, 0.4);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  backdrop-filter: blur(4px);
  z-index: 10;
}
.btn-float-switch svg { width: 15px; height: 15px; fill: currentColor; }

.controls { display: flex; gap: 6px; margin-bottom: 2px; }
.bottom-controls { display: flex; gap: 6px; }

button {
  padding: 5px 10px; border-radius: 6px; border: 1px solid var(--button-border); background: var(--button); color: var(--button-text); font-weight: 600; font-size: 0.8rem; cursor: pointer;
}

.btn-start { flex: 1; font-size: 0.85rem; background: var(--button) !important; color: var(--button-text) !important; border-color: var(--button-border) !important; }
.btn-stop { flex: 1; font-size: 0.85rem; background: var(--button) !important; color: var(--button-text) !important; border-color: var(--button-border) !important; }
.btn-secondary { flex: 1; font-size: 0.75rem; background: var(--button); color: var(--button-text); border-color: var(--button-border); }

.result-val { font-size: 1.1rem; font-weight: 800; color: var(--green-strong); margin: 2px 0; word-break: break-all; }

#conf-text {
  font-size: 1.4rem;
  font-weight: 900;
  line-height: 1;
}

input {
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--button-border);
}
</style>
</head>
<body data-theme="light">

<div class="app-container">
    <div style="display: flex; flex-direction: column; padding: 2px 4px;">
        <div style="font-size: 1.3rem; font-weight: 900; color: var(--green-strong); letter-spacing: -0.3px; line-height: 1.1;">AI Camera</div>
        <div style="font-size: 0.7rem; color: var(--muted); font-weight: 600;">AI Vision with Teachable Machine</div>
    </div>

    <div style="display: flex; gap: 6px; width: 100%;">
        <section class="card" style="flex: 0 0 68%; padding: 5px 10px;">
            <div style="color: var(--muted); font-size: 0.65rem; font-weight: 600;">ผลการวิเคราะห์ข้อมูล</div>
            <div class="result-val" id="name">--</div>
            <div>
                <span style="font-size: 0.6rem; color: var(--muted);">สถานะ : <b id="esp-status" style="color: #ef4444;">Connecting...</b></span>
            </div>
        </section>

        <section class="card" style="flex: 0 0 calc(32% - 6px); justify-content: center; align-items: center; text-align: center; padding: 2px;">
            <div style="color: var(--muted); font-size: 0.6rem; font-weight: 600; margin-bottom: 2px;">ความแม่นยำ</div>
            <span id="conf-text" style="color: var(--muted);">0.0%</span>
        </section>
    </div>

    <section class="card" style="flex: 1; justify-content: space-between; padding: 6px 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 0.75rem;">AI Camera</span>
            <span id="current-group-label" style="font-size: 0.6rem; font-weight: 700; color: var(--topic-color);">Topic : --</span>
        </div>
        
        <div class="video-box">
            <video id="video" class="front-cam" autoplay muted playsinline></video>
            <button class="btn-float-switch" onclick="switchCamera()" title="สลับกล้อง">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </button>
        </div>
        
        <div>
            <div class="controls">
                <button class="btn-start" id="start-btn">Running...</button>
                <button class="btn-stop" id="stop-btn">Stop</button>
            </div>
            <div class="bottom-controls">
                <button class="btn-secondary" onclick="testConnection()">Test</button>
                <button class="btn-secondary" onclick="toggleTheme()">Theme</button>
            </div>
        </div>
    </section>

    <section class="card" style="gap: 3px; padding: 5px 10px;">
        <div>
            <div style="font-size: 0.6rem; font-weight: 600; margin-bottom: 1px; color: var(--muted);">Teachable Model ID</div>
            <input type="text" id="model-input" placeholder="เช่น Voxb2VGd2" style="width: 100%; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem;">
        </div>
        
        <div style="display: flex; gap: 6px;">
            <div style="flex: 1;">
                <div style="font-size: 0.6rem; font-weight: 600; margin-bottom: 1px; color: var(--muted);">School ID</div>
                <input type="text" id="school-input" placeholder="PTL-School" style="width: 100%; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem;">
            </div>
            <div style="flex: 1;">
                <div style="font-size: 0.6rem; font-weight: 600; margin-bottom: 1px; color: var(--muted);">Name ID</div>
                <input type="text" id="name-input" placeholder="group1" style="width: 100%; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem;">
            </div>
        </div>

        <button onclick="saveSettings()" style="background: var(--button); color: var(--button-text); border-radius: 4px; padding: 4px; font-size: 0.75rem; width: 100%; border: 1px solid var(--button-border); font-weight: 600; margin-top: 1px;">SAVE</button>
    </section>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;

    let savedId = localStorage.getItem("saved_model_id") || "";
    if (savedId) document.getElementById("model-input").value = savedId;

    let savedSchool = localStorage.getItem("saved_school_id") || "PTL-School";
    document.getElementById("school-input").value = savedSchool;

    let savedNameId = localStorage.getItem("saved_name_id") || "group1";
    document.getElementById("name-input").value = savedNameId;

    updateTopicDisplay(savedSchool, savedNameId);
});

function saveSettings() {
    const modelVal = document.getElementById("model-input").value.trim();
    const schoolVal = document.getElementById("school-input").value.trim() || "PTL-School";
    const nameVal = document.getElementById("name-input").value.trim() || "group1";
    
    if (!modelVal) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }

    localStorage.setItem("saved_model_id", modelVal);
    localStorage.setItem("saved_school_id", schoolVal);
    localStorage.setItem("saved_name_id", nameVal);
    
    updateTopicDisplay(schoolVal, nameVal);
    alert("บันทึกค่าเรียบร้อย! กำลังเชื่อมต่อระบบใหม่...");
    
    initMQTT();
}

function updateTopicDisplay(schoolId, nameId) {
    document.getElementById("current-group-label").textContent = "Topic : " + schoolId + "/" + nameId;
}

    let nameId = localStorage.getItem("saved_name_id") || "group1";
    return "gelectronlab/" + schoolId + "/" + nameId + "/status";
}
