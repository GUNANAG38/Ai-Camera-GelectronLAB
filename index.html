<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

<style>
:root{
  --bg:#ffffff;
  --bg-gradient:linear-gradient(145deg,#ffffff 0%,#f8fff9 38%,#d4f3da 100%);
  --card:rgba(255,255,255,.96); --text:#111827; --muted:#667085;
  --green:#21a957; --green-strong:#159447; --border:#dce7e0;
  --button:#f1f5f9; --button-border:#cbd5e1; --button-text:#0f172a;
  --shadow:0 10px 26px rgba(31,73,45,.075); --video-border:#d8e6dd;
  --status-bg:rgba(255,255,255,.9);
  --topic-color: #000000;
}

[data-theme='dark'] {
  --bg: #0f172a;
  --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
  --card: rgba(30, 41, 59, 0.96);
  --text: #f8fafc;
  --muted: #94a3b8;
  --green: #22c55e;
  --green-strong: #16a34a;
  --border: #334155;
  --button: #1e293b;
  --button-border: #475569;
  --button-text: #f8fafc;
  --shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
  --video-border: #475569;
  --status-bg: rgba(30, 41, 59, 0.9);
  --topic-color: #ffffff;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
  overflow: hidden; background: var(--bg); background-image: var(--bg-gradient); color: var(--text);
  font-family: sans-serif; display: flex; justify-content: center; align-items: center;
}

.app-container {
  width: 100%; max-width: 480px; height: 100%; max-height: 100vh; max-height: 100dvh;
  padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; justify-content: space-between;
}

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}

.video-box {
  width: 100%; flex: 1; min-height: 140px; background: #000; border-radius: 8px;
  overflow: hidden; display: flex; justify-content: center; align-items: center;
  position: relative; border: 1px solid var(--video-border);
  margin-top: 2px; margin-bottom: 2px;
}
video { width: 100%; height: 100%; object-fit: cover; }
video.front-cam { transform: scaleX(-1); }
video.back-cam { transform: scaleX(1); }

.btn-float-switch {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(0, 0, 0, 0.4);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  backdrop-filter: blur(4px);
  z-index: 10;
}
.btn-float-switch svg { width: 16px; height: 16px; fill: currentColor; }

.controls { display: flex; gap: 6px; margin-bottom: 3px; }
.bottom-controls { display: flex; gap: 6px; }

button {
  padding: 8px 10px; border-radius: 6px; border: 1px solid var(--button-border); background: var(--button); color: var(--button-text); font-weight: 600; font-size: 0.85rem; cursor: pointer;
}

.btn-start { flex: 1; font-size: 0.9rem; background: var(--button) !important; color: var(--button-text) !important; border-color: var(--button-border) !important; }
.btn-stop { flex: 1; font-size: 0.9rem; background: var(--button) !important; color: var(--button-text) !important; border-color: var(--button-border) !important; }
.btn-secondary { flex: 1; font-size: 0.8rem; background: var(--button); color: var(--button-text); border-color: var(--button-border); }

.result-val { font-size: 1.2rem; font-weight: 800; color: var(--green-strong); margin: 2px 0; word-break: break-all; }

#conf-text {
  font-size: 1.6rem;
  font-weight: 900;
  line-height: 1;
}

input {
  background: var(--button);
  color: var(--text);
  border: 1px solid var(--button-border);
}
</style>
</head>
<body data-theme="light">

<div class="app-container">
    <!-- ส่วนหัว ขยายฟ้อนต์ให้ใหญ่เต็มตา -->
    <div style="display: flex; flex-direction: column; padding: 2px 4px;">
        <div style="font-size: 1.5rem; font-weight: 900; color: var(--green-strong); letter-spacing: -0.3px; line-height: 1.1;">AI Camera</div>
        <div style="font-size: 0.8rem; color: var(--muted); font-weight: 600;">AI Vision with Teachable Machine</div>
    </div>

    <!-- ผลการวิเคราะห์ข้อมูล -->
    <div style="display: flex; gap: 6px; width: 100%;">
        <section class="card" style="flex: 0 0 68%;">
            <div style="color: var(--muted); font-size: 0.7rem; font-weight: 600;">ผลการวิเคราะห์ข้อมูล</div>
            <div class="result-val" id="name">--</div>
            <div>
                <span style="font-size: 0.7rem; color: var(--muted);">สถานะ : <b id="esp-status" style="color: #ef4444;">Connecting...</b></span>
            </div>
        </section>

        <section class="card" style="flex: 0 0 calc(32% - 6px); justify-content: center; align-items: center; text-align: center; padding: 4px;">
            <div style="color: var(--muted); font-size: 0.7rem; font-weight: 600; margin-bottom: 2px;">ความแม่นยำ</div>
            <span id="conf-text" style="color: var(--muted);">0.0%</span>
        </section>
    </div>

    <!-- ส่วนแสดงกล้อง (ขยายพื้นที่ให้ใหญ่เต็มจอเพื่อลดช่องว่าง) -->
    <section class="card" style="flex: 1; justify-content: space-between;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 0.85rem;">AI Camera</span>
            <span id="current-group-label" style="font-size: 0.7rem; font-weight: 700; color: var(--topic-color);">Topic : --</span>
        </div>
        
        <div class="video-box">
            <video id="video" class="front-cam" autoplay muted playsinline></video>
            <button class="btn-float-switch" onclick="switchCamera()" title="สลับกล้อง">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </button>
        </div>
        
        <div>
            <div class="controls">
                <button class="btn-start" id="start-btn">Running...</button>
                <button class="btn-stop" id="stop-btn">Stop</button>
            </div>
            <div class="bottom-controls">
                <button class="btn-secondary" onclick="testConnection()">Test</button>
                <button class="btn-secondary" onclick="toggleTheme()">Theme</button>
            </div>
        </div>
    </section>

    <!-- ส่วนตั้งค่า -->
    <section class="card" style="gap: 4px; padding: 6px 10px;">
        <div>
            <div style="font-size: 0.65rem; font-weight: 600; margin-bottom: 2px; color: var(--muted);">Teachable Model ID</div>
            <input type="text" id="model-input" placeholder="เช่น Voxb2VGd2" style="width: 100%; padding: 4px 6px; border-radius: 4px; font-size: 0.8rem;">
        </div>
        
        <div style="display: flex; gap: 6px;">
            <div style="flex: 1;">
                <div style="font-size: 0.65rem; font-weight: 600; margin-bottom: 2px; color: var(--muted);">School ID</div>
                <input type="text" id="school-input" placeholder="PTL-School" style="width: 100%; padding: 4px 6px; border-radius: 4px; font-size: 0.8rem;">
            </div>
            <div style="flex: 1;">
                <div style="font-size: 0.65rem; font-weight: 600; margin-bottom: 2px; color: var(--muted);">Name ID</div>
                <input type="text" id="name-input" placeholder="group1" style="width: 100%; padding: 4px 6px; border-radius: 4px; font-size: 0.8rem;">
            </div>
        </div>

        <button onclick="saveSettings()" style="background: var(--button); color: var(--button-text); border-radius: 4px; padding: 6px; font-size: 0.8rem; width: 100%; border: 1px solid var(--button-border); font-weight: 600; margin-top: 2px;">SAVE</button>
    </section>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;

    let savedId = localStorage.getItem("saved_model_id") || "";
    if (savedId) document.getElementById("model-input").value = savedId;

    let savedSchool = localStorage.getItem("saved_school_id") || "PTL-School";
    document.getElementById("school-input").value = savedSchool;

    let savedNameId = localStorage.getItem("saved_name_id") || "group1";
    document.getElementById("name-input").value = savedNameId;

    updateTopicDisplay(savedSchool, savedNameId);
});

function saveSettings() {
    const modelVal = document.getElementById("model-input").value.trim();
    const schoolVal = document.getElementById("school-input").value.trim() || "PTL-School";
    const nameVal = document.getElementById("name-input").value.trim() || "group1";
    
    if (!modelVal) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }

    localStorage.setItem("saved_model_id", modelVal);
    localStorage.setItem("saved_school_id", schoolVal);
    localStorage.setItem("saved_name_id", nameVal);
    
    updateTopicDisplay(schoolVal, nameVal);
    alert("บันทึกค่าเรียบร้อย! กำลังเชื่อมต่อระบบใหม่...");
    
    initMQTT();
}

function updateTopicDisplay(schoolId, nameId) {
    document.getElementById("current-group-label").textContent = "Topic : " + schoolId + "/" + nameId;
}

const mqttHost = "broker.emqx.io";
const mqttPort = 8084; 

let mqttClient = null;
let isConnecting = false;

function getDynamicTopic() {
    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    return "gelectronlab/" + schoolId + "/" + nameId + "/status";
}

function initMQTT() {
    if (isConnecting) return;
    isConnecting = true;

    if (mqttClient) {
        try {
            mqttClient.onConnectionLost = null;
            if (mqttClient.isConnected()) {
                mqttClient.disconnect();
            }
        } catch(e) { console.log(e); }
    }

    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    let uniqueClientId = "WebClient-" + schoolId + "-" + nameId + "-" + Date.now() + "-" + Math.floor(Math.random() * 10000);
    
    mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), uniqueClientId);

    mqttClient.onConnectionLost = function (responseObject) {
        isConnecting = false;
        document.getElementById("esp-status").textContent = "Disconnected";
        document.getElementById("esp-status").style.color = "#ef4444";
        
        if (responseObject.errorCode !== 0) {
            console.log("MQTT Lost: " + responseObject.errorMessage);
            setTimeout(initMQTT, 5000);
        }
    };

    try {
        mqttClient.connect({
            onSuccess: function() {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Connected " + nameId + "";
                document.getElementById("esp-status").style.color = "var(--green-strong)";
                console.log("Connected Successfully as: " + uniqueClientId);
            },
            onFailure: function(message) {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Failed";
                document.getElementById("esp-status").style.color = "#ef4444";
                console.log("Connect Failed: " + message.errorMessage);
                setTimeout(initMQTT, 5000);
            },
            useSSL: true,
            timeout: 5,
            keepAliveInterval: 30
        });
    } catch(e) {
        isConnecting = false;
        console.error("MQTT Exception: ", e);
    }
}

initMQTT();

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
}

let model = null;
let running = false;
let lastSentTime = 0;
let currentFacingMode = "user";

async function sendToESP32(className) {
    if (Date.now() - lastSentTime < 1000) return;
    lastSentTime = Date.now();

    if (mqttClient && mqttClient.isConnected()) {
        let topic = getDynamicTopic();
        let message = new Paho.MQTT.Message(className);
        message.destinationName = topic;
        mqttClient.send(message);
        
        let nameId = localStorage.getItem("saved_name_id") || "group1";
        document.getElementById("esp-status").textContent = "Sent " + nameId + "";
        document.getElementById("esp-status").style.color = "var(--green-strong)";
    }
}

async function testConnection() {
    await sendToESP32("Test_Class");
    alert("ส่งสัญญาณทดสอบไปยัง Mini MicroKit PT-L เรียบร้อย!");
}

async function startCamera(facing) {
    if (window.currentStream) {
        window.currentStream.getTracks().forEach(track => track.stop());
    }

    const videoElement = document.getElementById("video");
    if (facing === "user") {
        videoElement.className = "front-cam";
    } else {
        videoElement.className = "back-cam";
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 224 }, height: { ideal: 224 } }
    });
    
    window.currentStream = stream;
    videoElement.srcObject = stream;
}

async function switchCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    if (running) {
        try {
            await startCamera(currentFacingMode);
        } catch(e) {
            alert("ไม่สามารถสลับกล้องได้: " + e.message);
        }
    } else {
        alert(currentFacingMode === "user" ? "ตั้งค่าเป็น: กล้องหน้า" : "ตั้งค่าเป็น: กล้องหลัง");
    }
}

document.getElementById("start-btn").onclick = async () => {
    let savedId = localStorage.getItem("saved_model_id") || document.getElementById("model-input").value.trim();
    if (!savedId) {
        alert("กรุณากรอกและกดบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    
    try {
        document.getElementById("start-btn").textContent = "Loading...";
        const MODEL_URL = `https://teachablemachine.withgoogle.com/models/${savedId}/`;
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        await startCamera(currentFacingMode);
        
        running = true;
        document.getElementById("start-btn").textContent = "Running...";
        loop();
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
        document.getElementById("start-btn").textContent = "Start AI";
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pctVal = best.probability * 100;
        let pctStr = pctVal.toFixed(1) + "%";
        
        let confElem = document.getElementById("conf-text");
        confElem.textContent = pctStr;

        if (pctVal > 90) {
            confElem.style.color = "var(--green-strong)";
        } else {
            confElem.style.color = "#ef4444";
        }
        
        if (best.probability > 0.90) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        } else {
            document.getElementById("name").textContent = "Uncertain...";
            await sendToESP32("Unknown"); 
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>

</body>
</html>
