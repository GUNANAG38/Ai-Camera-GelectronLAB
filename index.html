<style>
:root {
    --bg-color: #f0f4f1;
    --card-bg: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --accent: #16a34a;
    --accent-gradient: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
    --border: #e5e7eb;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    --header-glow: radial-gradient(circle at top right, rgba(34, 197, 94, 0.15), transparent 50%);
}

[data-theme='dark'] {
    --bg-color: #0b0f19;
    --card-bg: #131b2e;
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --accent: #22c55e;
    --accent-gradient: linear-gradient(135deg, #15803d 0%, #16a34a 100%);
    --border: #1e293b;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    --header-glow: radial-gradient(circle at top right, rgba(34, 197, 94, 0.05), transparent 50%);
}

* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: var(--bg-color); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center; align-items: center;
    background-image: var(--header-glow);
    background-repeat: no-repeat;
    background-size: 100% 40vh;
}

.app-container {
    width: 100%; max-width: 480px; height: 100%; max-height: 100vh; max-height: 100dvh;
    padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    overflow-y: auto;
}

/* App Header */
.app-header {
    display: flex; justify-content: space-between; align-items: center; padding: 2px 4px;
}
.app-title-group h1 {
    font-size: 1.5rem; font-weight: 800; color: var(--accent); margin: 0; line-height: 1.1;
    letter-spacing: -0.5px;
}
.app-title-group p {
    font-size: 0.75rem; color: var(--text-muted); margin: 2px 0 0 0; font-weight: 500;
}
.theme-toggle-btn {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 50%;
    width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; box-shadow: var(--shadow); transition: transform 0.2s;
}
.theme-toggle-btn:active { transform: scale(0.9); }
.theme-toggle-btn svg { width: 20px; height: 20px; fill: var(--text-main); }

/* Cards */
.card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}

/* Top Stats Row */
.stats-row { display: flex; gap: 8px; width: 100%; }
.stat-card-left { flex: 0 0 58%; justify-content: space-between; }
.stat-card-right { flex: 0 0 calc(42% - 8px); justify-content: space-between; align-items: center; text-align: center; }

.section-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.result-val { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 2px 0; word-break: break-all; }
.status-row-flex { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
.status-text { font-size: 0.7rem; color: var(--text-muted); }
.status-text b { color: var(--accent); }
.status-icon { font-size: 0.85rem; color: var(--accent); }

#conf-text { font-size: 1.45rem; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.5px; margin: 2px 0; }
.mini-chart { width: 100%; height: 16px; display: flex; align-items: flex-end; }
.mini-chart svg { width: 100%; height: 100%; overflow: visible; }

/* Camera Section */
.camera-section { gap: 6px; }
.camera-header-row { display: flex; justify-content: space-between; align-items: center; }
.camera-title { font-weight: 700; font-size: 0.85rem; }
.topic-label { font-size: 0.7rem; font-weight: 700; color: var(--accent); }

.video-box {
    width: 100%; height: 160px; background: #000; border-radius: 10px;
    overflow: hidden; display: flex; justify-content: center; align-items: center;
    position: relative;
}
video { width: 100%; height: 100%; object-fit: cover; }
video.front-cam { transform: scaleX(-1); }
video.back-cam { transform: scaleX(1); }

.live-badge {
    position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.15); padding: 2px 8px; border-radius: 20px;
    display: flex; align-items: center; gap: 5px; color: #fff; font-size: 0.65rem; font-weight: 700; z-index: 10;
}
.live-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 6px #22c55e; }

.btn-float-switch {
    position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.5); color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 32px; height: 32px;
    display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(4px);
    transition: transform 0.2s; z-index: 10;
}
.btn-float-switch:active { transform: scale(0.9); }
.btn-float-switch svg { width: 16px; height: 16px; fill: currentColor; }

/* Action Buttons */
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
button {
    padding: 10px; border-radius: 10px; border: 1px solid var(--border); font-weight: 600; font-size: 0.8rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card-bg); color: var(--text-main); transition: background 0.2s, transform 0.1s;
}
button:active { transform: scale(0.97); }
.btn-primary-action { background: var(--card-bg); color: var(--text-main); }
.btn-accent-action { background: var(--card-bg); color: var(--text-main); }
button svg { width: 14px; height: 14px; fill: currentColor; }

/* Settings Section */
.settings-section { gap: 6px; }
.settings-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 2px; }
.input-group label { font-size: 0.65rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 2px; }
.input-wrapper { position: relative; display: flex; align-items: center; }
input[type="text"] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-color); color: var(--text-main); font-size: 0.75rem; outline: none;
}
input[type="text"]:focus { border-color: var(--accent); }
.input-icon-btn {
    position: absolute; right: 8px; background: none; border: none; padding: 0; cursor: pointer; color: var(--text-muted);
}
.input-icon-btn svg { width: 14px; height: 14px; fill: currentColor; }

.settings-row { display: flex; gap: 6px; }
.btn-save {
    background: var(--accent-gradient); color: white; border: none; border-radius: 8px;
    padding: 9px; font-size: 0.8rem; font-weight: 700; width: 100%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
}

/* Footer Status Bar */
.footer-bar {
    display: flex; justify-content: space-between; align-items: center; padding: 4px 2px;
    font-size: 0.65rem; color: var(--text-muted); border-top: 1px solid var(--border);
}
.footer-status-item { display: flex; align-items: center; gap: 4px; font-weight: 600; }
.footer-status-item.success { color: var(--accent); }
.footer-divider { width: 1px; height: 10px; background: var(--border); }
.footer-bar svg { width: 12px; height: 12px; fill: currentColor; }
.footer-meta { text-align: center; font-size: 0.6rem; color: var(--text-muted); margin-top: -2px; }
</style>
</head>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "dark";
    document.body.dataset.theme = savedTheme;
    updateThemeIcon(savedTheme);

    let savedId = localStorage.getItem("saved_model_id") || "Voxb2VGd2";
    document.getElementById("model-input").value = savedId;

    let savedSchool = localStorage.getItem("saved_school_id") || "PTL-School";
    document.getElementById("school-input").value = savedSchool;

    let savedNameId = localStorage.getItem("saved_name_id") || "group1";
    document.getElementById("name-input").value = savedNameId;

    updateTopicDisplay(savedSchool, savedNameId);
});

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
    updateThemeIcon(currentTheme);
}

function updateThemeIcon(theme) {
    const icon = document.getElementById("theme-icon");
    if (theme === 'dark') {
        icon.setAttribute("d", "M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.446z");
    } else {
        icon.setAttribute("d", "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06z");
    }
}

function copyModelId() {
    const input = document.getElementById("model-input");
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value);
    alert("คัดลอก Model ID เรียบร้อยแล้ว!");
}

function saveSettings() {
    const modelVal = document.getElementById("model-input").value.trim();
    const schoolVal = document.getElementById("school-input").value.trim() || "PTL-School";
    const nameVal = document.getElementById("name-input").value.trim() || "group1";
    
    if (!modelVal) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }

    localStorage.setItem("saved_model_id", modelVal);
    localStorage.setItem("saved_school_id", schoolVal);
    localStorage.setItem("saved_name_id", nameVal);
    
    updateTopicDisplay(schoolVal, nameVal);
    alert("บันทึกค่าเรียบร้อย! กำลังเชื่อมต่อระบบใหม่...");
    initMQTT();
}

function updateTopicDisplay(schoolId, nameId) {
    document.getElementById("current-group-label").textContent = "Topic : " + schoolId + "/" + nameId;
}

const mqttHost = "broker.emqx.io";
const mqttPort = 8084; 

let mqttClient = null;
let isConnecting = false;

function getDynamicTopic() {
    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    return "gelectronlab/" + schoolId + "/" + nameId + "/status";
}

function initMQTT() {
    if (isConnecting) return;
    isConnecting = true;

    if (mqttClient) {
        try {
            mqttClient.onConnectionLost = null;
            if (mqttClient.isConnected()) {
                mqttClient.disconnect();
            }
        } catch(e) { console.log(e); }
    }

    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    let uniqueClientId = "WebClient-" + schoolId + "-" + nameId + "-" + Date.now() + "-" + Math.floor(Math.random() * 10000);
    
    mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), uniqueClientId);

    mqttClient.onConnectionLost = function (responseObject) {
        isConnecting = false;
        document.getElementById("esp-status").textContent = "Disconnected";
        document.getElementById("esp-status").style.color = "#ef4444";
        document.getElementById("footer-mqtt-status").textContent = "Disconnected";
        document.getElementById("footer-mqtt-status").style.color = "#ef4444";
        
        if (responseObject.errorCode !== 0) {
            console.log("MQTT Lost: " + responseObject.errorMessage);
            setTimeout(initMQTT, 5000);
        }
    };

    try {
        mqttClient.connect({
            onSuccess: function() {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Sent " + nameId;
                document.getElementById("esp-status").style.color = "var(--accent)";
                document.getElementById("footer-mqtt-status").textContent = "Connected";
                document.getElementById("footer-mqtt-status").style.color = "var(--accent)";
                console.log("Connected Successfully as: " + uniqueClientId);
            },
            onFailure: function(message) {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Failed";
                document.getElementById("esp-status").style.color = "#ef4444";
                document.getElementById("footer-mqtt-status").textContent = "Failed";
                document.getElementById("footer-mqtt-status").style.color = "#ef4444";
                console.log("Connect Failed: " + message.errorMessage);
                setTimeout(initMQTT, 5000);
            },
            useSSL: true,
            timeout: 5,
            keepAliveInterval: 30
        });
    } catch(e) {
        isConnecting = false;
        console.error("MQTT Exception: ", e);
    }
}

initMQTT();

let model = null;
let running = false;
let lastSentTime = 0;
let currentFacingMode = "user";

async function sendToESP32(className) {
    if (Date.now() - lastSentTime < 1000) return;
    lastSentTime = Date.now();

    if (mqttClient && mqttClient.isConnected()) {
        let topic = getDynamicTopic();
        let message = new Paho.MQTT.Message(className);
        message.destinationName = topic;
        mqttClient.send(message);
        
        let nameId = localStorage.getItem("saved_name_id") || "group1";
        document.getElementById("esp-status").textContent = "Sent " + nameId;
        document.getElementById("esp-status").style.color = "var(--accent)";
    }
}

async function testConnection() {
    await sendToESP32("Test_Class");
    alert("ส่งสัญญาณทดสอบไปยัง Mini MicroKit PT-L เรียบร้อย!");
}

async function startCamera(facing) {
    if (window.currentStream) {
        window.currentStream.getTracks().forEach(track => track.stop());
    }

    const videoElement = document.getElementById("video");
    if (facing === "user") {
        videoElement.className = "front-cam";
    } else {
        videoElement.className = "back-cam";
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 224 }, height: { ideal: 224 } }
    });
    
    window.currentStream = stream;
    videoElement.srcObject = stream;
}

async function switchCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    if (running) {
        try {
            await startCamera(currentFacingMode);
        } catch(e) {
            alert("ไม่สามารถสลับกล้องได้: " + e.message);
        }
    } else {
        alert(currentFacingMode === "user" ? "ตั้งค่าเป็น: กล้องหน้า" : "ตั้งค่าเป็น: กล้องหลัง");
    }
}

document.getElementById("start-btn").onclick = async () => {
    let savedId = localStorage.getItem("saved_model_id") || document.getElementById("model-input").value.trim();
    if (!savedId) {
        alert("กรุณากรอกและกดบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    
    try {
        document.getElementById("start-btn-text").textContent = "Loading...";
        const MODEL_URL = `https://teachablemachine.withgoogle.com/models/${savedId}/`;
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        await startCamera(currentFacingMode);
        
        running = true;
        document.getElementById("start-btn-text").textContent = "Running...";
        loop();
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
        document.getElementById("start-btn-text").textContent = "Running...";
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pctVal = best.probability * 100;
        let pctStr = pctVal.toFixed(1) + "%";
        
        let confElem = document.getElementById("conf-text");
        confElem.textContent = pctStr;
        
        if (best.probability > 0.90) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        } else {
            document.getElementById("name").textContent = "Uncertain...";
            await sendToESP32("Unknown"); 
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>
