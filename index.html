<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera MQTT</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

[data-theme='dark'] {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --border: #334155;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
}

* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: var(--bg-color); color: var(--text-main);
    font-family: sans-serif; display: flex; justify-content: center; align-items: center;
}

.app-container {
    width: 100%; max-width: 480px; height: 100%; max-height: 100vh;
    padding: 8px; display: flex; flex-direction: column; gap: 6px; justify-content: space-between;
}

.card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}

.video-box {
    width: 100%; flex: 1; min-height: 42vh; background: #000; border-radius: 8px;
    overflow: hidden; display: flex; justify-content: center; align-items: center;
    position: relative;
    margin-top: 6px; margin-bottom: 6px;
}
video { width: 100%; height: 100%; object-fit: cover; }
video.front-cam { transform: scaleX(-1); }
video.back-cam { transform: scaleX(1); }

/* ปุ่มสลับกล้องแบบไอคอนลูกศรวน สีขาว พื้นหลังใส */
.btn-float-switch {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.4);
    color: #ffffff; /* ตัวไอคอนสีขาว */
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.2s;
    z-index: 10;
}
.btn-float-switch:active {
    transform: translateX(-50%) scale(0.9);
    background: rgba(0, 0, 0, 0.7);
}
.btn-float-switch svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

.controls { display: flex; gap: 6px; margin-bottom: 4px; }
.bottom-controls { display: flex; gap: 6px; }

button {
    padding: 10px 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer;
}

.btn-start { background: var(--accent); color: white; flex: 1; }
.btn-stop { background: #ef4444; color: white; flex: 1; }
.btn-secondary { background: var(--border); color: var(--text-main); flex: 1; font-size: 0.8rem; }

.result-val { font-size: 1.25rem; font-weight: 800; color: var(--accent); margin: 2px 0; }
</style>
</head>
<body data-theme="light">

<div class="app-container">
    <!-- ส่วนตั้งค่า Model ID -->
    <section class="card">
        <div style="font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; color: var(--text-muted);">Teachable Model ID</div>
        <div style="display: flex; gap: 6px;">
            <input type="text" id="model-input" placeholder="เช่น my-model-xxxx" style="flex:1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 0.85rem;">
            <button onclick="saveModelId()" style="background: var(--accent); color: white; border-radius: 6px; padding: 6px 12px; font-size: 0.85rem;">บันทึก</button>
        </div>
    </section>

    <!-- ส่วนแสดงกล้องและการควบคุม -->
    <section class="card" style="flex: 1; justify-content: space-between;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 1.1rem;">AI Camera (MQTT)</span>
            <span style="font-size: 0.8rem; font-weight: 600; color: var(--accent);">MiniMicroKit_PT-L</span>
        </div>
        
        <div class="video-box">
            <video id="video" class="front-cam" autoplay muted playsinline></video>
            <!-- ปุ่มสลับกล้องไอคอนลูกศรวน (ตามแบบที่ต้องการ) -->
            <button class="btn-float-switch" onclick="switchCamera()" title="สลับกล้อง">
                <svg viewBox="0 0 512 512">
                    <path d="M142.9 142.9c62.2-62.2 163-62.2 225.2 0 49.3 49.3 58 122.9 26.2 181.2l-47.5-47.5c15.3-33.3 8.3-74.1-19.1-101.5-35.3-35.3-92.7-35.3-128 0-30.8 30.8-34.9 78.4-12.3 113.8l-47.5 47.5c-34.8-54-28-124.9 23-173.5zm226.2 226.2c-62.2 62.2-163 62.2-225.2 0-49.3-49.3-58-122.9-26.2-181.2l47.5 47.5c-15.3 33.3-8.3 74.1 19.1 101.5 35.3 35.3 92.7 35.3 128 0 30.8-30.8 34.9-78.4 12.3-113.8l47.5-47.5c34.8 54 28 124.9-23 173.5z"/>
                </svg>
            </button>
        </div>
        
        <div>
            <div class="controls">
                <button class="btn-start" id="start-btn">Start AI</button>
                <button class="btn-stop" id="stop-btn">Stop</button>
            </div>
            <div class="bottom-controls">
                <button class="btn-secondary" onclick="testConnection()">Test MQTT</button>
                <button class="btn-secondary" onclick="toggleTheme()">Switch Theme</button>
            </div>
        </div>
    </section>

    <!-- ส่วนแสดงผลลัพธ์ -->
    <section class="card">
        <div style="color: var(--text-muted); font-size: 0.75rem; font-weight: 600;">AI Analysis Data</div>
        <div class="result-val" id="name">--</div>
        <div style="font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between;">
            <span>MQTT Status: <b id="esp-status" style="color: #ef4444;">Connecting...</b></span>
            <span id="conf-text">0.0%</span>
        </div>
    </section>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;

    let savedId = localStorage.getItem("saved_model_id") || "";
    if (savedId) {
        document.getElementById("model-input").value = savedId;
    }
});

function saveModelId() {
    const val = document.getElementById("model-input").value.trim();
    if (!val) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }
    localStorage.setItem("saved_model_id", val);
    alert("บันทึก Model ID เรียบร้อยแล้ว: " + val);
}

// --- ตั้งค่าระบบ MQTT ---
const mqttHost = "broker.emqx.io";
const mqttPort = 8084; 
const mqttTopic = "gelectronlab/ai_camera/status";

let clientId = "WebClient-" + Math.floor(Math.random() * 100000);
let mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), clientId);

mqttClient.onConnectionLost = function (responseObject) {
    document.getElementById("esp-status").textContent = "Disconnected";
    document.getElementById("esp-status").style.color = "#ef4444";
    setTimeout(connectMQTT, 4000);
};

function connectMQTT() {
    try {
        mqttClient.connect({
            onSuccess: function() {
                document.getElementById("esp-status").textContent = "Connected (Web)";
                document.getElementById("esp-status").style.color = "#2563eb";
            },
            onFailure: function(message) {
                document.getElementById("esp-status").textContent = "Failed";
                document.getElementById("esp-status").style.color = "#ef4444";
            },
            useSSL: true,
            timeout: 5
        });
    } catch(e) {
        console.error("MQTT Exception: ", e);
    }
}

connectMQTT();

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
}

let model = null;
let running = false;
let lastSentTime = 0;
let currentFacingMode = "user";

async function sendToESP32(name) {
    if (Date.now() - lastSentTime < 1000) return;
    lastSentTime = Date.now();

    let cleanName = name.trim().toLowerCase();
    if (cleanName.includes("mask") && !cleanName.includes("not")) {
        cleanName = "face mask";
    } else {
        cleanName = "Not face mask";
    }

    if (mqttClient && mqttClient.isConnected()) {
        let message = new Paho.MQTT.Message(cleanName);
        message.destinationName = mqttTopic;
        mqttClient.send(message);
        document.getElementById("esp-status").textContent = "Sent: " + cleanName;
        document.getElementById("esp-status").style.color = "#16a34a";
    }
}

async function testConnection() {
    await sendToESP32("face mask");
    alert("ส่งสัญญาณทดสอบ MQTT แล้ว!");
}

async function startCamera(facing) {
    if (window.currentStream) {
        window.currentStream.getTracks().forEach(track => track.stop());
    }

    const videoElement = document.getElementById("video");
    
    if (facing === "user") {
        videoElement.className = "front-cam";
    } else {
        videoElement.className = "back-cam";
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 224 }, height: { ideal: 224 } }
    });
    
    window.currentStream = stream;
    videoElement.srcObject = stream;
}

async function switchCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    if (running) {
        try {
            await startCamera(currentFacingMode);
        } catch(e) {
            alert("ไม่สามารถสลับกล้องได้: " + e.message);
        }
    } else {
        alert(currentFacingMode === "user" ? "ตั้งค่าเป็น: กล้องหน้า" : "ตั้งค่าเป็น: กล้องหลัง");
    }
}

document.getElementById("start-btn").onclick = async () => {
    let savedId = localStorage.getItem("saved_model_id") || document.getElementById("model-input").value.trim();
    if (!savedId) {
        alert("กรุณากรอกและกดบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    
    try {
        document.getElementById("start-btn").textContent = "Loading...";
        const MODEL_URL = `https://teachablemachine.withgoogle.com/models/${savedId}/`;
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        
        await startCamera(currentFacingMode);
        
        running = true;
        document.getElementById("start-btn").textContent = "Running...";
        loop();
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
        document.getElementById("start-btn").textContent = "Start AI";
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pct = (best.probability * 100).toFixed(1);
        document.getElementById("conf-text").textContent = pct + "%";
        
        if (best.probability > 0.75) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>

</body>
</html>
