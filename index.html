<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera - GelectronLAB</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

[data-theme='dark'] {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --border: #334155;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
}

* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: var(--bg-color); color: var(--text-main);
    font-family: sans-serif; display: flex; justify-content: center; align-items: center;
}

.app-container {
    width: 100%; max-width: 480px; height: 100%; max-height: 100vh; max-height: 100dvh;
    padding: 6px; display: flex; flex-direction: column; gap: 4px; justify-content: space-between;
}

.card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}

.video-box {
    width: 100%; flex: 1; min-height: 0; background: #000; border-radius: 6px;
    overflow: hidden; display: flex; justify-content: center; align-items: center;
    position: relative;
    margin-top: 2px; margin-bottom: 2px;
}
video { width: 100%; height: 100%; object-fit: cover; }
video.front-cam { transform: scaleX(-1); }
video.back-cam { transform: scaleX(1); }

.btn-float-switch {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.4);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.2s;
    z-index: 10;
}
.btn-float-switch:active {
    transform: scale(0.9);
    background: rgba(0, 0, 0, 0.7);
}
.btn-float-switch svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}

.controls { display: flex; gap: 4px; margin-bottom: 2px; }
.bottom-controls { display: flex; gap: 4px; }

button {
    padding: 8px 10px; border-radius: 6px; border: none; font-weight: 600; font-size: 0.8rem; cursor: pointer;
}

.btn-start { background: var(--accent); color: white; flex: 1; }
.btn-stop { background: #ef4444; color: white; flex: 1; }
.btn-secondary { background: var(--border); color: var(--text-main); flex: 1; font-size: 0.75rem; }

.result-val { font-size: 1rem; font-weight: 800; color: var(--accent); margin: 1px 0; word-break: break-all; }

#conf-text {
    font-size: 1.1rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.5px;
}
</style>
</head>
<body data-theme="light">

<div class="app-container">
    <!-- ส่วนแสดงผลการวิเคราะห์ (ปรับแบ่งเป็น 2 กล่องย่อย 70% และ 30%) -->
    <div style="display: flex; gap: 4px; width: 100%;">
        <!-- โซนซ้าย 70%: ผลลัพธ์ชื่อ class และสถานะการเชื่อมต่อ -->
        <section class="card" style="flex: 0 0 70%;">
            <div style="color: var(--text-muted); font-size: 0.65rem; font-weight: 600;">ผลการวิเคราะห์ข้อมูล</div>
            <div class="result-val" id="name">--</div>
            <div style="margin-top: 1px;">
                <span style="font-size: 0.65rem; color: var(--text-muted);">สถานะ : <b id="esp-status" style="color: #ef4444;">Connecting...</b></span>
            </div>
        </section>

        <!-- โซนขวา 30%: ตัวเลขเปอร์เซ็นต์การวิเคราะห์ -->
        <section class="card" style="flex: 0 0 calc(30% - 4px); justify-content: center; align-items: center; text-align: center; padding: 4px;">
            <div style="color: var(--text-muted); font-size: 0.8rem; font-weight: 800; margin-bottom: 2px;">ความมั่นใจ</div>
            <span id="conf-text" style="color: var(--text-muted);">0.0%</span>
        </section>
    </div>

    <!-- ส่วนแสดงกล้องและการควบคุม (อยู่ตรงกลางเหมือนเดิม 100%) -->
    <section class="card" style="flex: 1; justify-content: space-between; min-height: 0;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 0.85rem;">AI Camera | GelectronLAB</span>
            <span id="current-group-label" style="font-size: 0.65rem; font-weight: 700; color: var(--accent);">Topic : --</span>
        </div>
        
        <div class="video-box">
            <video id="video" class="front-cam" autoplay muted playsinline></video>
            <button class="btn-float-switch" onclick="switchCamera()" title="สลับกล้อง">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </button>
        </div>
        
        <div>
            <div class="controls">
                <button class="btn-start" id="start-btn">Start AI</button>
                <button class="btn-stop" id="stop-btn">Stop</button>
            </div>
            <div class="bottom-controls">
                <button class="btn-secondary" onclick="testConnection()">Test</button>
                <button class="btn-secondary" onclick="toggleTheme()">Theme</button>
            </div>
        </div>
    </section>

    <!-- ส่วนตั้งค่า Model ID, School ID และ Name ID (อยู่ด้านล่างสุดเหมือนเดิม 100%) -->
    <section class="card" style="gap: 4px;">
        <div>
            <div style="font-size: 0.6rem; font-weight: 600; margin-bottom: 1px; color: var(--text-muted);">Teachable Model ID</div>
            <input type="text" id="model-input" placeholder="เช่น my-model-xxxx" style="width: 100%; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 0.75rem;">
        </div>
        
        <div style="display: flex; gap: 4px;">
            <div style="flex: 1;">
                <div style="font-size: 0.6rem; font-weight: 600; margin-bottom: 1px; color: var(--text-muted);">School ID</div>
                <input type="text" id="school-input" placeholder="เช่น PTL-School" style="width: 100%; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 0.75rem;">
            </div>
            <div style="flex: 1;">
                <div style="font-size: 0.6rem; font-weight: 600; margin-bottom: 1px; color: var(--text-muted);">Name ID</div>
                <input type="text" id="name-input" placeholder="เช่น group1" style="width: 100%; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 0.75rem;">
            </div>
        </div>

        <button onclick="saveSettings()" style="background: var(--accent); color: white; border-radius: 4px; padding: 5px 10px; font-size: 0.75rem; width: 100%; margin-top: 1px;">SAVE</button>
    </section>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;

    let savedId = localStorage.getItem("saved_model_id") || "";
    if (savedId) document.getElementById("model-input").value = savedId;

    let savedSchool = localStorage.getItem("saved_school_id") || "PTL-School";
    document.getElementById("school-input").value = savedSchool;

    let savedNameId = localStorage.getItem("saved_name_id") || "group1";
    document.getElementById("name-input").value = savedNameId;

    updateTopicDisplay(savedSchool, savedNameId);
});

function saveSettings() {
    const modelVal = document.getElementById("model-input").value.trim();
    const schoolVal = document.getElementById("school-input").value.trim() || "PTL-School";
    const nameVal = document.getElementById("name-input").value.trim() || "group1";
    
    if (!modelVal) {
        alert("กรุณากรอก Model ID ให้ถูกต้อง");
        return;
    }

    localStorage.setItem("saved_model_id", modelVal);
    localStorage.setItem("saved_school_id", schoolVal);
    localStorage.setItem("saved_name_id", nameVal);
    
    updateTopicDisplay(schoolVal, nameVal);
    alert("บันทึกค่าเรียบร้อย! กำลังเชื่อมต่อ ระบบใหม่...");
    
    initMQTT();
}

function updateTopicDisplay(schoolId, nameId) {
    document.getElementById("current-group-label").textContent = "Topic : " + schoolId + "/" + nameId;
}

const mqttHost = "broker.emqx.io";
const mqttPort = 8084; 

let mqttClient = null;
let isConnecting = false;

function getDynamicTopic() {
    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    return "gelectronlab/" + schoolId + "/" + nameId + "/status";
}

function initMQTT() {
    if (isConnecting) return;
    isConnecting = true;

    if (mqttClient) {
        try {
            mqttClient.onConnectionLost = null;
            if (mqttClient.isConnected()) {
                mqttClient.disconnect();
            }
        } catch(e) { console.log(e); }
    }

    let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
    let nameId = localStorage.getItem("saved_name_id") || "group1";
    let uniqueClientId = "WebClient-" + schoolId + "-" + nameId + "-" + Date.now() + "-" + Math.floor(Math.random() * 10000);
    
    mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), uniqueClientId);

    mqttClient.onConnectionLost = function (responseObject) {
        isConnecting = false;
        document.getElementById("esp-status").textContent = "Disconnected";
        document.getElementById("esp-status").style.color = "#ef4444";
        
        if (responseObject.errorCode !== 0) {
            console.log("MQTT Lost: " + responseObject.errorMessage);
            setTimeout(initMQTT, 5000);
        }
    };

    try {
        mqttClient.connect({
            onSuccess: function() {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Connected " + nameId + "";
                document.getElementById("esp-status").style.color = "#2563eb";
                console.log("Connected Successfully as: " + uniqueClientId);
            },
            onFailure: function(message) {
                isConnecting = false;
                document.getElementById("esp-status").textContent = "Failed";
                document.getElementById("esp-status").style.color = "#ef4444";
                console.log("Connect Failed: " + message.errorMessage);
                setTimeout(initMQTT, 5000);
            },
            useSSL: true,
            timeout: 5,
            keepAliveInterval: 30
        });
    } catch(e) {
        isConnecting = false;
        console.error("MQTT Exception: ", e);
    }
}

initMQTT();

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
}

let model = null;
let running = false;
let lastSentTime = 0;
let currentFacingMode = "user";

async function sendToESP32(className) {
    if (Date.now() - lastSentTime < 1000) return;
    lastSentTime = Date.now();

    if (mqttClient && mqttClient.isConnected()) {
        let topic = getDynamicTopic();
        let message = new Paho.MQTT.Message(className);
        message.destinationName = topic;
        mqttClient.send(message);
        
        let nameId = localStorage.getItem("saved_name_id") || "group1";
        document.getElementById("esp-status").textContent = "Sent " + nameId + "";
        document.getElementById("esp-status").style.color = "#16a34a";
    }
}

async function testConnection() {
    await sendToESP32("Test_Class");
    alert("ส่งสัญญาณทดสอบไปยัง Mini MicroKit PT-L เรียบร้อย!");
}

async function startCamera(facing) {
    if (window.currentStream) {
        window.currentStream.getTracks().forEach(track => track.stop());
    }

    const videoElement = document.getElementById("video");
    if (facing === "user") {
        videoElement.className = "front-cam";
    } else {
        videoElement.className = "back-cam";
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 224 }, height: { ideal: 224 } }
    });
    
    window.currentStream = stream;
    videoElement.srcObject = stream;
}

async function switchCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    if (running) {
        try {
            await startCamera(currentFacingMode);
        } catch(e) {
            alert("ไม่สามารถสลับกล้องได้: " + e.message);
        }
    } else {
        alert(currentFacingMode === "user" ? "ตั้งค่าเป็น: กล้องหน้า" : "ตั้งค่าเป็น: กล้องหลัง");
    }
}

document.getElementById("start-btn").onclick = async () => {
    let savedId = localStorage.getItem("saved_model_id") || document.getElementById("model-input").value.trim();
    if (!savedId) {
        alert("กรุณากรอกและกดบันทึก Model ID ก่อนกด Start AI");
        return;
    }
    
    try {
        document.getElementById("start-btn").textContent = "Loading...";
        const MODEL_URL = `https://teachablemachine.withgoogle.com/models/${savedId}/`;
        const u = MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";
        
        model = await tmImage.load(u + "model.json", u + "metadata.json");
        await startCamera(currentFacingMode);
        
        running = true;
        document.getElementById("start-btn").textContent = "Running...";
        loop();
    } catch(e) {
        alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
        document.getElementById("start-btn").textContent = "Start AI";
    }
};

async function loop() {
    if (!running) return;
    try {
        const prediction = await model.predict(document.getElementById("video"), false);
        let best = prediction.sort((a, b) => b.probability - a.probability)[0];
        
        let pctVal = best.probability * 100;
        let pctStr = pctVal.toFixed(1) + "%";
        
        let confElem = document.getElementById("conf-text");
        confElem.textContent = pctStr;

        if (pctVal > 90) {
            confElem.style.color = "#16a34a";
        } else {
            confElem.style.color = "#ef4444";
        }
        
        if (best.probability > 0.90) {
            document.getElementById("name").textContent = best.className;
            await sendToESP32(best.className);
        } else {
            document.getElementById("name").username = "Uncertain...";
            document.getElementById("name").textContent = "Uncertain...";
            await sendToESP32("Unknown"); 
        }
    } catch (err) {
        console.error(err);
    }
    if (running) {
        requestAnimationFrame(loop);
    }
}

document.getElementById("stop-btn").onclick = () => {
    running = false;
    location.reload();
};
</script>

</body>
</html>
