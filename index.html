<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Camera</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

<style>
:root{
  --bg:#f7fbf7;
  --bg-gradient:
    radial-gradient(circle at 82% 0%, rgba(137,221,145,.34) 0, rgba(137,221,145,0) 30%),
    radial-gradient(circle at 100% 72%, rgba(183,237,183,.24) 0, rgba(183,237,183,0) 34%),
    linear-gradient(145deg,#ffffff 0%,#f5fbf5 55%,#eef9ef 100%);
  --card:rgba(255,255,255,.92);
  --input:rgba(255,255,255,.76);
  --text:#111827;
  --muted:#667085;
  --green:#21a957;
  --green-strong:#159447;
  --green-soft:#eaf7ed;
  --border:#dce8df;
  --button:#ffffff;
  --button-border:#d7e8dc;
  --button-text:#111827;
  --video-border:#d5e5da;
  --shadow:0 8px 24px rgba(35,86,49,.075);
  --save-bg:#159447;
  --save-border:#117337;
  --save-text:#ffffff;
  --footer-bg:rgba(255,255,255,.82);
  --danger:#ef4444;
}

[data-theme="dark"]{
  --bg:#05080c;
  --bg-gradient:
    radial-gradient(circle at 85% 0%, rgba(35,85,53,.20) 0, rgba(35,85,53,0) 28%),
    radial-gradient(circle at 0% 85%, rgba(22,65,42,.16) 0, rgba(22,65,42,0) 30%),
    linear-gradient(145deg,#05080c 0%,#080d12 52%,#05080c 100%);
  --card:rgba(11,16,22,.90);
  --input:rgba(5,9,14,.72);
  --text:#f5f7fa;
  --muted:#a9b4c2;
  --green:#55e879;
  --green-strong:#4bdc70;
  --green-soft:rgba(59,130,83,.12);
  --border:#202a35;
  --button:#151c25;
  --button-border:#26313e;
  --button-text:#f5f7fa;
  --video-border:#202a35;
  --shadow:0 10px 28px rgba(0,0,0,.30);
  --save-bg:#16a34a;
  --save-border:#15803d;
  --save-text:#ffffff;
  --footer-bg:rgba(10,16,21,.80);
  --danger:#ff6464;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  background-image:var(--bg-gradient);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  overscroll-behavior:none;
}

button,input{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button{
  border:0;
  cursor:pointer;
}

.app-container{
  width:100%;
  max-width:900px;
  height:100%;
  padding:
    max(10px,env(safe-area-inset-top))
    clamp(10px,2.8vw,28px)
    max(8px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-rows:
    auto
    auto
    minmax(0,1fr)
    auto;
  gap:clamp(7px,1.2vh,14px);
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:0 clamp(4px,.8vw,8px);
  min-height:0;
}

.brand-title{
  font-size:clamp(1.9rem,5vw,3.1rem);
  font-weight:900;
  line-height:.98;
  letter-spacing:-1.4px;
  color:var(--green-strong);
}

.brand-subtitle{
  margin-top:6px;
  font-size:clamp(.76rem,1.7vw,1rem);
  color:var(--muted);
  font-weight:500;
}

.theme-top{
  width:clamp(44px,6.5vw,58px);
  height:clamp(44px,6.5vw,58px);
  border-radius:15px;
  background:var(--button);
  border:1px solid var(--border);
  color:var(--text);
  display:grid;
  place-items:center;
  box-shadow:var(--shadow);
  flex:0 0 auto;
}

.theme-top svg{width:52%;height:52%}

.header-actions{
  display:flex;
  align-items:center;
  gap:clamp(6px,1vw,10px);
}

.test-top{
  color:var(--green-strong);
  font-size:clamp(.72rem,1.7vw,.88rem);
  font-weight:700;
  letter-spacing:.1px;
}
.theme-switch{position:relative}
.theme-switch svg{display:block}
.theme-icon-sun{display:none !important}
[data-theme="dark"] .theme-icon-moon{display:none !important}
[data-theme="dark"] .theme-icon-sun{display:block !important}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(7px,1vw,14px);
  min-height:0;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:clamp(14px,2vw,22px);
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.summary-card{
  min-height:clamp(84px,11vh,142px);
  padding:clamp(12px,2vw,24px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.card-label{
  color:var(--muted);
  font-size:clamp(.70rem,1.6vw,.95rem);
  font-weight:600;
  margin-bottom:clamp(5px,1vh,9px);
}

.result-val{
  color:var(--text);
  font-size:clamp(1.25rem,4.2vw,2.15rem);
  font-weight:850;
  line-height:1.08;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:clamp(6px,1vh,10px);
  color:var(--muted);
  font-size:clamp(.68rem,1.55vw,.92rem);
}

.status-text{
  color:var(--green-strong);
  font-weight:600;
}

.sent-icon{
  margin-left:auto;
  width:clamp(22px,3.5vw,34px);
  height:clamp(22px,3.5vw,34px);
  color:var(--green-strong);
}

.conf-card{
  position:relative;
}

.conf-value{
  color:var(--green-strong);
  font-size:clamp(1.65rem,5vw,2.7rem);
  font-weight:900;
  line-height:1;
}

.conf-chart{
  width:100%;
  height:clamp(18px,3.2vh,32px);
  margin-top:auto;
  overflow:visible;
}

.camera-card{
  min-height:0;
  padding:clamp(11px,1.8vw,20px);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:clamp(8px,1.2vh,12px);
}

.camera-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:0;
}

.camera-title{
  font-size:clamp(1.05rem,2.8vw,1.55rem);
  font-weight:800;
}

.topic{
  color:var(--text);
  font-size:clamp(.68rem,1.65vw,.95rem);
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:55%;
}

.video-box{
  position:relative;
  width:100%;
  min-height:0;
  background:#000;
  border-radius:clamp(12px,1.8vw,18px);
  overflow:hidden;
  border:1px solid var(--video-border);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

video.front-cam{transform:scaleX(-1)}
video.back-cam{transform:scaleX(1)}

.btn-float-switch{
  position:absolute;
  top:clamp(9px,1.6vw,16px);
  right:clamp(9px,1.6vw,16px);
  z-index:5;
  width:clamp(42px,6.5vw,58px);
  height:clamp(42px,6.5vw,58px);
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#111827;
  border:1px solid rgba(0,0,0,.05);
  display:grid;
  place-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
}

[data-theme="dark"] .btn-float-switch{
  background:rgba(10,15,21,.82);
  color:#fff;
  border-color:#27313c;
}

.btn-float-switch svg{width:48%;height:48%;fill:currentColor}

.controls-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(7px,1vw,12px);
}

.control-btn{
  min-height:clamp(32px, 4.2vh, 46px);
  border-radius:clamp(10px, 1.4vw, 15px);
  background:var(--button);
  color:var(--button-text);
  border:1px solid var(--button-border);
  font-size:clamp(.78rem, 1.8vw, .98rem);
  font-weight:650;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(6px, 1vw, 10px);
  box-shadow:0 2px 7px rgba(0,0,0,.025);
}

.control-btn svg{
  width:clamp(18px,3vw,25px);
  height:clamp(18px,3vw,25px);
  fill:currentColor;
}

.settings-card{
  padding:clamp(8px, 1.4vw, 16px);
  display:flex;
  flex-direction:column;
  gap:clamp(5px, 0.9vh, 9px);
}

.settings-title{
  color:var(--muted);
  font-size:clamp(.75rem, 1.7vw, .95rem);
  font-weight:650;
}

.field-label{
  color:var(--muted);
  font-size:clamp(.65rem, 1.45vw, .82rem);
  margin-bottom:2px;
}

input{
  width:100%;
  height:clamp(32px, 4.4vh, 44px);
  padding:0 clamp(8px, 1.5vw, 14px);
  border-radius:clamp(7px, 1.1vw, 10px);
  outline:none;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  font-size:clamp(.78rem, 1.7vw, .92rem);
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(33,169,87,.10);
}

.model-wrap{position:relative}
.model-wrap input{padding-right:48px}

.copy-btn{
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  background:transparent;
  color:var(--muted);
  display:grid;
  place-items:center;
}

.copy-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}

.two-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(7px,1.1vw,12px);
}

.save-btn{
  width:100%;
  height:clamp(28px, 3.6vh, 38px);
  border-radius:clamp(7px, 1vw, 9px);
  background:var(--save-bg);
  color:var(--save-text);
  border:1px solid var(--save-border);
  font-size:clamp(.76rem, 1.6vw, .88rem);
  font-weight:650;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
}

.mini-footer{
  position:fixed;
  left:50%;
  bottom:max(3px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:20;
  font-size:clamp(9px,1.6vw,12px);
  font-weight:500;
  letter-spacing:.3px;
  color:var(--muted);
  white-space:nowrap;
  opacity:.72;
  pointer-events:none;
  line-height:1;
}

@media (max-height:700px){
  .app-container{gap:5px}
  .brand-title{font-size:clamp(1.65rem,5vw,2.2rem)}
  .brand-subtitle{margin-top:3px}
  .summary-card{min-height:68px;padding:9px 12px}
  .camera-card{gap:5px;padding:8px}
  .settings-card{padding:6px 8px;gap:4px}
  .settings-title{display:none}
  .control-btn{min-height:38px}
  input{height:30px}
  .save-btn{height:32px}
}

@media (max-width:360px){
  .app-container{padding-left:7px;padding-right:7px}
  .summary{gap:5px}
  .result-val{font-size:1.05rem}
  .status-row{font-size:.62rem}
  .control-btn{font-size:.75rem;gap:6px}
  .topic{max-width:50%;font-size:.61rem}
}

@media (min-width:700px){
  .app-container{
    padding-left:clamp(20px,4vw,48px);
    padding-right:clamp(20px,4vw,48px);
  }
}
</style>
</head>

<body data-theme="light">

<div class="app-container">

  <header class="header">
    <div>
      <div class="brand-title">AI Camera</div>
      <div class="brand-subtitle">AI Vision with Teachable Machine</div>
    </div>

    <div class="header-actions">
      <button class="theme-top test-top" onclick="testConnection()" title="ทดสอบการเชื่อมต่อ" aria-label="ทดสอบการเชื่อมต่อ">
        <span>Test</span>
      </button>
      <button class="theme-top theme-switch" onclick="toggleTheme()" title="เปลี่ยนธีม" aria-label="เปลี่ยนธีม">
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
          <circle cx="12" cy="12" r="3.5"/>
          <path d="M12 2.5v2M12 19.5v2M4.58 4.58l1.42 1.42M18 18l1.42 1.42M2.5 12h2M19.5 12h2M4.58 19.42L6 18M18 6l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="summary">

    <div class="card summary-card">
      <div class="card-label">ผลการวิเคราะห์ข้อมูล</div>
      <div class="result-val" id="name">--</div>

      <div class="status-row">
        <span>สถานะ:</span>
        <b class="status-text" id="esp-status">Connecting...</b>

        <svg class="sent-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.7 3.3a1 1 0 0 0-1.03-.24l-18 7a1 1 0 0 0 .06 1.88l7.24 2.41 2.4 7.24a1 1 0 0 0 .94.68h.03a1 1 0 0 0 .93-.73l7.7-17.1a1 1 0 0 0-.27-1.14ZM10.8 13.2 5.7 11.5l11.73-4.56-6.63 6.26Zm1.45 1.45 5.85-5.52-4.34 9.64-1.51-4.12Z"/>
        </svg>
      </div>
    </div>

    <div class="card summary-card conf-card">
      <div class="card-label">ความแม่นยำ</div>
      <div class="conf-value" id="conf-text">0.0%</div>

      <svg class="conf-chart" id="confidence-chart" viewBox="0 0 240 38" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#35c76b" stop-opacity=".22"/>
            <stop offset="1" stop-color="#35c76b" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path id="chart-area" d="" fill="url(#chartFill)"/>
        <path id="chart-line" d="" fill="none" stroke="#35c76b" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="chart-dot" cx="240" cy="19" r="4.2" fill="#35c76b"/>
      </svg>
    </div>

  </section>

  <section class="card camera-card">

    <div class="camera-heading">
      <span class="camera-title">Camera</span>
      <span class="topic" id="current-group-label">Topic : --</span>
    </div>

    <div class="video-box">
      <video id="video" class="front-cam" autoplay muted playsinline></video>

      <button class="btn-float-switch" onclick="switchCamera()" title="สลับกล้อง" aria-label="สลับกล้อง">
        <svg viewBox="0 0 24 24">
          <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
        </svg>
      </button>
    </div>

    <div class="controls-grid">
      <button class="control-btn" id="start-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span>Running...</span>
      </button>

      <button class="control-btn" id="stop-btn">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        <span>Stop</span>
      </button>
    </div>

  </section>

  <section class="card settings-card">

    <div class="settings-title">การตั้งค่าโมเดลและการเชื่อมต่อ</div>

    <div>
      <div class="field-label">Teachable Model ID</div>
      <div class="model-wrap">
        <input type="text" id="model-input" placeholder="เช่น Voxb2VGd2">
        <button class="copy-btn" onclick="copyModelId()" title="คัดลอก Model ID" aria-label="คัดลอก Model ID">
          <svg viewBox="0 0 24 24">
            <rect x="8" y="8" width="11" height="11" rx="2"/>
            <path d="M5 16H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="two-fields">
      <div>
        <div class="field-label">School ID</div>
        <input type="text" id="school-input" placeholder="PTL-School">
      </div>

      <div>
        <div class="field-label">Name ID</div>
        <input type="text" id="name-input" placeholder="group1">
      </div>
    </div>

    <button class="save-btn" onclick="saveSettings()">SAVE</button>

  </section>

</div>

<div class="mini-footer">Mini MicroKit PT-L V1.0 | AI Vision</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem("theme") || "light";
  document.body.dataset.theme = savedTheme;

  let savedId = localStorage.getItem("saved_model_id") || "";
  if (savedId) document.getElementById("model-input").value = savedId;

  let savedSchool = localStorage.getItem("saved_school_id") || "PTL-School";
  document.getElementById("school-input").value = savedSchool;

  let savedNameId = localStorage.getItem("saved_name_id") || "group1";
  document.getElementById("name-input").value = savedNameId;

  updateTopicDisplay(savedSchool, savedNameId);
});

function saveSettings() {
  const modelVal = document.getElementById("model-input").value.trim();
  const schoolVal = document.getElementById("school-input").value.trim() || "PTL-School";
  const nameVal = document.getElementById("name-input").value.trim() || "group1";

  if (!modelVal) {
    alert("กรุณากรอก Model ID ให้ถูกต้อง");
    return;
  }

  localStorage.setItem("saved_model_id", modelVal);
  localStorage.setItem("saved_school_id", schoolVal);
  localStorage.setItem("saved_name_id", nameVal);

  updateTopicDisplay(schoolVal, nameVal);
  alert("บันทึกค่าเรียบร้อย! กำลังเชื่อมต่อระบบใหม่...");

  initMQTT();
}

function copyModelId(){
  const input = document.getElementById("model-input");
  if(!input.value) return;

  navigator.clipboard?.writeText(input.value)
    .then(() => alert("คัดลอก Model ID แล้ว"))
    .catch(() => {
      input.select();
      document.execCommand("copy");
      alert("คัดลอก Model ID แล้ว");
    });
}

function updateTopicDisplay(schoolId, nameId) {
  document.getElementById("current-group-label").textContent =
    "Topic : " + schoolId + "/" + nameId;
}

const mqttHost = "broker.emqx.io";
const mqttPort = 8084;

let mqttClient = null;
let isConnecting = false;

function getDynamicTopic() {
  let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
  let nameId = localStorage.getItem("saved_name_id") || "group1";
  return "gelectronlab/" + schoolId + "/" + nameId + "/status";
}

function initMQTT() {
  if (isConnecting) return;
  isConnecting = true;

  if (mqttClient) {
    try {
      mqttClient.onConnectionLost = null;
      if (mqttClient.isConnected()) mqttClient.disconnect();
    } catch(e) {
      console.log(e);
    }
  }

  let schoolId = localStorage.getItem("saved_school_id") || "PTL-School";
  let nameId = localStorage.getItem("saved_name_id") || "group1";
  let uniqueClientId =
    "WebClient-" + schoolId + "-" + nameId + "-" +
    Date.now() + "-" + Math.floor(Math.random() * 10000);

  mqttClient = new Paho.MQTT.Client(
    mqttHost,
    Number(mqttPort),
    uniqueClientId
  );

  mqttClient.onConnectionLost = function(responseObject) {
    isConnecting = false;

    document.getElementById("esp-status").textContent = "Disconnected";
    document.getElementById("esp-status").style.color = "#ef4444";

    if (responseObject.errorCode !== 0) {
      console.log("MQTT Lost: " + responseObject.errorMessage);
      setTimeout(initMQTT, 5000);
    }
  };

  try {
    mqttClient.connect({
      onSuccess: function() {
        isConnecting = false;
        document.getElementById("esp-status").textContent = "Connected " + nameId;
        document.getElementById("esp-status").style.color = "var(--green-strong)";
        console.log("Connected Successfully as: " + uniqueClientId);
      },

      onFailure: function(message) {
        isConnecting = false;
        document.getElementById("esp-status").textContent = "Failed";
        document.getElementById("esp-status").style.color = "#ef4444";
        console.log("Connect Failed: " + message.errorMessage);
        setTimeout(initMQTT, 5000);
      },

      useSSL: true,
      timeout: 5,
      keepAliveInterval: 30
    });
  } catch(e) {
    isConnecting = false;
    console.error("MQTT Exception: ", e);
  }
}

initMQTT();

function toggleTheme() {
  const body = document.body;
  const currentTheme = body.dataset.theme === "dark" ? "light" : "dark";
  body.dataset.theme = currentTheme;
  localStorage.setItem("theme", currentTheme);
}

let model = null;
let running = false;
let lastSentTime = 0;
let currentFacingMode = "user";
let predictionBusy = false;

const confidenceHistory = [];
const GRAPH_POINTS = 30;
const GRAPH_UPDATE_MS = 150;

let latestConfidence = 0;
let lastGraphRender = 0;
let graphInitialized = false;

function renderConfidenceGraph(value) {
  const chartLine = document.getElementById("chart-line");
  const chartArea = document.getElementById("chart-area");
  const chartDot = document.getElementById("chart-dot");

  if (!chartLine || !chartArea || !chartDot) return;

  value = Math.max(0, Math.min(100, Number(value) || 0));

  confidenceHistory.push(value);

  if (confidenceHistory.length > GRAPH_POINTS) {
    confidenceHistory.shift();
  }

  const data = [...confidenceHistory];

  while (data.length < GRAPH_POINTS) {
    data.unshift(data.length ? data[0] : value);
  }

  const width = 240;
  const height = 38;
  const topPadding = 3;
  const bottomPadding = 4;
  const graphHeight = height - topPadding - bottomPadding;
  const stepX = width / (GRAPH_POINTS - 1);

  let linePath = "";
  let lastX = 0;
  let lastY = height / 2;

  for (let i = 0; i < GRAPH_POINTS; i++) {
    const x = i * stepX;
    const y = topPadding + ((100 - data[i]) / 100) * graphHeight;

    if (i === 0) {
      linePath = `M ${x.toFixed(2)} ${y.toFixed(2)}`;
    } else {
      linePath += ` L ${x.toFixed(2)} ${y.toFixed(2)}`;
    }

    if (i === GRAPH_POINTS - 1) {
      lastX = x;
      lastY = y;
    }
  }

  const areaPath =
    linePath +
    ` L ${lastX.toFixed(2)} ${height}` +
    ` L 0 ${height} Z`;

  chartLine.setAttribute("d", linePath);
  chartArea.setAttribute("d", areaPath);
  chartDot.setAttribute("cx", lastX.toFixed(2));
  chartDot.setAttribute("cy", lastY.toFixed(2));

  graphInitialized = true;
}

function updateConfidenceGraph(value) {
  latestConfidence = Math.max(0, Math.min(100, Number(value) || 0));

  const now = performance.now();

  if (!graphInitialized || now - lastGraphRender >= GRAPH_UPDATE_MS) {
    lastGraphRender = now;
    renderConfidenceGraph(latestConfidence);
  }
}

renderConfidenceGraph(0);

async function sendToESP32(className) {
  if (Date.now() - lastSentTime < 1000) return;
  lastSentTime = Date.now();

  if (mqttClient && mqttClient.isConnected()) {
    let topic = getDynamicTopic();
    let message = new Paho.MQTT.Message(className);
    message.destinationName = topic;
    mqttClient.send(message);

    let nameId = localStorage.getItem("saved_name_id") || "group1";
    document.getElementById("esp-status").textContent = "Sent " + nameId;
    document.getElementById("esp-status").style.color = "var(--green-strong)";
  }
}

async function testConnection() {
  await sendToESP32("Test_Class");
  alert("ส่งสัญญาณทดสอบไปยัง Mini MicroKit PT-L เรียบร้อย!");
}

async function startCamera(facing) {
  if (window.currentStream) {
    window.currentStream.getTracks().forEach(track => track.stop());
  }

  const videoElement = document.getElementById("video");

  if (facing === "user") {
    videoElement.className = "front-cam";
  } else {
    videoElement.className = "back-cam";
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: facing,
      width: { ideal: 224 },
      height: { ideal: 224 }
    }
  });

  window.currentStream = stream;
  videoElement.srcObject = stream;
}

async function switchCamera() {
  currentFacingMode =
    (currentFacingMode === "user") ? "environment" : "user";

  if (running) {
    try {
      await startCamera(currentFacingMode);
    } catch(e) {
      alert("ไม่สามารถสลับกล้องได้: " + e.message);
    }
  } else {
    alert(
      currentFacingMode === "user"
        ? "ตั้งค่าเป็น: กล้องหน้า"
        : "ตั้งค่าเป็น: กล้องหลัง"
    );
  }
}

document.getElementById("start-btn").onclick = async () => {
  let savedId =
    localStorage.getItem("saved_model_id") ||
    document.getElementById("model-input").value.trim();

  if (!savedId) {
    alert("กรุณากรอกและกดบันทึก Model ID ก่อนกด Start AI");
    return;
  }

  try {
    document.getElementById("start-btn").querySelector("span").textContent = "Loading...";

    const MODEL_URL =
      `https://teachablemachine.withgoogle.com/models/${savedId}/`;
    const u =
      MODEL_URL.endsWith("/") ? MODEL_URL : MODEL_URL + "/";

    model = await tmImage.load(
      u + "model.json",
      u + "metadata.json"
    );

    await startCamera(currentFacingMode);

    running = true;
    document.getElementById("start-btn").querySelector("span").textContent = "Running...";
    loop();

  } catch(e) {
    alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้: " + e.message);
    document.getElementById("start-btn").querySelector("span").textContent = "Running...";
  }
};

async function loop() {
  if (!running || predictionBusy) return;

  predictionBusy = true;

  try {
    const prediction =
      await model.predict(document.getElementById("video"), false);

    let best =
      prediction.reduce((highest, item) =>
        item.probability > highest.probability ? item : highest
      );

    let pctVal = best.probability * 100;
    let pctStr = pctVal.toFixed(1) + "%";

    let confElem = document.getElementById("conf-text");
    confElem.textContent = pctStr;

    updateConfidenceGraph(pctVal);

    if (pctVal > 90) {
      confElem.style.color = "var(--green-strong)";
    } else {
      confElem.style.color = "var(--danger)";
    }

    if (best.probability > 0.90) {
      document.getElementById("name").textContent = best.className;
      sendToESP32(best.className);
    } else {
      document.getElementById("name").textContent = "Uncertain...";
      sendToESP32("Unknown");
    }

  } catch(err) {
    console.error(err);
  } finally {
    predictionBusy = false;
  }

  if (running) {
    requestAnimationFrame(loop);
  }
}

document.getElementById("stop-btn").onclick = () => {
  running = false;
  predictionBusy = false;
  confidenceHistory.length = 0;
  latestConfidence = 0;
  lastGraphRender = 0;
  graphInitialized = false;
  renderConfidenceGraph(0);

  if (window.currentStream) {
    window.currentStream.getTracks().forEach(track => track.stop());
    window.currentStream = null;
  }

  location.reload();
};
</script>
